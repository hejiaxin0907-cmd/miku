<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfbfa" />
    <title>Orbita GPT — Agent workspace copy</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fbfbfa;
        --surface: #ffffff;
        --surface-soft: #f6f7f7;
        --ink: #111a20;
        --ink-soft: #556069;
        --muted: #9ca3a6;
        --line: #e7e9e8;
        --navy: #131f3d;
        --navy-soft: #243252;
        --blue: #6c8cf4;
        --shadow: 0 12px 34px rgba(22, 34, 53, 0.07);
        --radius-lg: 18px;
        --radius-md: 14px;
        --ease: cubic-bezier(.22, 1, .36, 1);
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, textarea { font: inherit; }
      button { border: 0; cursor: pointer; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid rgba(108, 140, 244, .32); outline-offset: 3px; }
      .icon-slot { display: inline-grid; place-items: center; flex: 0 0 auto; overflow: visible; }
      .icon-slot > svg, .icon-slot > img { display: block; width: 100%; height: 100%; overflow: visible; }
      .icon-slot > svg { transform-origin: center; }

      .app-shell { min-height: 100dvh; display: flex; overflow: hidden; }

      .sidebar {
        width: 224px;
        flex: 0 0 224px;
        min-height: 100dvh;
        padding: 28px 20px 22px;
        border-right: 1px solid var(--line);
        background: rgba(255, 255, 255, .82);
        display: flex;
        flex-direction: column;
      }

      .brand-row { display: flex; align-items: center; gap: 13px; padding: 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -.02em; }

      .brand-orb, .hero-orb {
        position: relative;
        border-radius: 50%;
        background: radial-gradient(circle at 34% 28%, #f4f7ff 0 13%, #a8bbff 18%, #718ef7 38%, #4b68ed 62%, #8e64ef 100%);
        box-shadow: inset 5px 6px 10px rgba(255,255,255,.46), inset -8px -9px 15px rgba(22, 34, 53, .12), 0 9px 20px rgba(22, 34, 53, .10);
      }
      .brand-orb { width: 32px; height: 28px; border-radius: 0; background: url("./assets/miku-orb-brand.png") center / contain no-repeat; box-shadow: none; }
      .brand-orb::after { display: none; }
      .brand-orb::after, .hero-orb::after { content: ""; position: absolute; inset: 18% 22% 34% 28%; border-radius: 50%; background: rgba(255,255,255,.54); filter: blur(1px); }

      .side-section { margin-top: 30px; }
      .section-label { color: var(--muted); font-size: 12px; font-weight: 600; line-height: 14.4px; margin: 0 4px 10px; letter-spacing: .01em; }
      .side-list { display: grid; gap: 3px; }
      .side-item {
        width: 100%;
        min-height: 38px;
        padding: 8px 8px;
        background: transparent;
        color: #28323a;
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 18px;
        text-align: left;
        font-size: 14px;
        font-weight: 500;
        line-height: 17.5px;
        transition: background .2s ease, color .2s ease;
      }
      .side-item:hover, .side-item.active { background: #f2f4f5; color: var(--ink); }
      .side-item svg { color: #8e979b; flex: 0 0 auto; }
      .side-item.active svg { color: var(--navy); }
      .side-item .icon-slot svg { --side-icon-accent: currentColor; }
      .top-nav-list .side-item .icon-accent { opacity: 1; transition: fill .18s ease, stroke .18s ease; }
      .top-nav-list .side-item:hover .icon-slot svg { --side-icon-accent: var(--blue); color: var(--blue); }
      .top-nav-list .side-item.active .icon-slot svg { --side-icon-accent: currentColor; }
      .top-nav-list .side-item:hover { background: rgba(108, 140, 244, .10); color: var(--blue); }
      .top-nav-list .side-item.active { color: var(--blue); background: rgba(108, 140, 244, .10); }
      .top-nav-list .side-item.active svg { color: var(--blue); }
      .top-nav-list .side-item { color: #59666a; min-height: 42px; gap: 10px; font-size: 14px; font-weight: 500; line-height: 17.5px; }
      .top-nav-list .icon-slot,
      .project-icon,
      .recent-item .icon-slot { width: 14px; height: 14px; }

      .project-item { color: #59666a; font-size: 14px; font-weight: 500; line-height: 17.5px; }
      .project-item:hover { color: var(--ink); }
      .project-icon { width: 14px; height: 14px; flex: 0 0 auto; background: transparent; color: #7d888b; display: inline-grid; place-items: center; }
      .recent-section { margin-top: 22px; }
      .recent-item { color: #59666a; font-size: 14px; font-weight: 500; line-height: 17.5px; }
      .recent-item .icon-slot { width: 14px; height: 14px; }
      .recent-item svg { color: #9ba5a8; }
      .side-item > span:last-child { white-space: nowrap; }

      .sidebar-bottom { margin-top: auto; display: grid; gap: 14px; }
      .upgrade {
        padding: 12px 13px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        transition: border-color .2s ease, box-shadow .2s ease;
      }
      .upgrade:hover { border-color: #ccd2d4; box-shadow: var(--shadow); }
      .upgrade .icon-slot { width: 14px; height: 14px; }
      .profile { display: flex; align-items: center; gap: 10px; padding: 0 4px; color: var(--ink-soft); font-size: 12px; font-weight: 500; line-height: 1.2; }
      .profile-mark { width: 26px; height: 26px; border-radius: 9px; background: #eef1ff; color: #536fd6; display: grid; place-items: center; font-weight: 700; }

      .workspace { flex: 1; min-width: 0; min-height: 100dvh; padding: 24px clamp(24px, 4vw, 64px) 30px; display: flex; flex-direction: column; }
      .topbar { min-height: 46px; display: flex; align-items: flex-start; justify-content: flex-start; }
      .template-search { position: relative; width: min(280px, 100%); max-width: 280px; }
      .template-search-input { display: block; width: 100%; height: 40px; padding: 0 16px 0 42px; border: 2px solid transparent; border-radius: 12px; outline: none; background: #f3f3f4; color: var(--ink); font: inherit; font-size: 14px; line-height: 28px; transition: .3s ease; }
      .template-search-input::placeholder { color: #9e9ea7; }
      .template-search-input:focus, .template-search-input:hover { border-color: rgba(108, 140, 244, .42); background: #fff; box-shadow: 0 0 0 4px rgba(108, 140, 244, .10); }
      .template-search-icon { position: absolute; left: 16px; top: 50%; width: 16px; height: 16px; color: #9e9ea7; pointer-events: none; transform: translateY(-50%); }
      .template-search:focus-within .template-search-icon { color: var(--blue); }
      .hero { text-align: center; padding-top: clamp(24px, 3.5vh, 42px); }
      .hero-orb { width: 68px; height: 58px; margin: 0 auto 19px; border-radius: 0; background: url("./assets/hero-orb-clean.png") center / contain no-repeat; box-shadow: none; }
      .hero-orb::after { display: none; }
      .hero h1 { margin: 0; color: var(--ink); font-size: 32px; line-height: 1.03; letter-spacing: -.055em; font-weight: 720; }
      .hero h1 span { display: inline-block; font-size: .84em; transform: translateY(-1px); }
      .hero p { margin: 13px auto 0; color: var(--muted); font-size: 14px; line-height: 1.5; letter-spacing: -.01em; }

      .skill-strip { width: max-content; max-width: 100%; margin: 14px auto 0; display: flex; gap: 8px; }
      .skill-card { flex: 0 0 auto; min-width: 0; min-height: 36px; padding: 3px 8px; border: 1px solid rgba(211, 216, 216, .78); border-radius: 999px; background: rgba(246, 247, 247, .82); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7); transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease, transform .2s var(--ease); }
      .skill-card:hover, .skill-card:focus-visible { border-color: rgba(211, 216, 216, .78); background: #fff; color: var(--blue); box-shadow: 0 6px 14px rgba(22, 34, 53, .08); transform: translateY(-1px); }
      .skill-card:active { transform: translateY(0); }
      .skill-card-label { min-width: 0; overflow: hidden; font-size: 11.5px; font-weight: 600; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
      .skill-card:nth-child(n + 6) { display: none; }
      .skill-strip.is-showing-more .skill-card:nth-child(-n + 5) { display: none; }
      .skill-strip.is-showing-more .skill-card:nth-child(n + 6) { display: flex; }
      .skill-more { width: 36px; min-width: 36px; min-height: 36px; padding: 0; border: 1px solid rgba(211, 216, 216, .78); border-radius: 999px; background: rgba(246, 247, 247, .82); color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7); transition: border-color .2s ease, background-color .2s ease, box-shadow .2s ease, transform .2s var(--ease); }
      .skill-more:hover, .skill-more:focus-visible { border-color: rgba(211, 216, 216, .78); background: #fff; color: var(--ink); box-shadow: 0 6px 14px rgba(22, 34, 53, .08); transform: translateY(-1px); }
      .skill-more:active { transform: translateY(0); }
      .skill-more-icon { display: inline-flex; width: 18px; height: 18px; align-items: center; justify-content: center; transition: transform .25s var(--ease); }
      .skill-more-icon svg { display: block; width: 18px; height: 18px; }
      .skill-strip.is-showing-more .skill-more-icon { transform: rotate(180deg); }

      .miku-composer-section { --miku-row-height: 42px; --miku-action-row-height: 40px; position: relative; width: min(100%, 860px); margin: clamp(72px, 8vh, 104px) auto 0; padding: 0 3px 0; overflow: visible; border: 0; border-radius: 0; background: transparent; background-image: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .miku-composer-section::before { content: ""; position: absolute; left: 3px; right: 3px; top: calc(100% - var(--miku-action-row-height) - 28px); bottom: 0; z-index: 0; border-radius: 0 0 28px 28px; background: linear-gradient(180deg, rgba(241, 245, 255, .56) 0%, rgba(213, 225, 255, .48) 45%, rgba(183, 201, 255, .42) 100%); pointer-events: none; }
      .miku-composer-surface { display: none; }
      .miku-composer-surface path { fill: #fff; stroke: none; }
      .miku-composer-outline { display: none; }
      .miku-mode-tabs { --miku-tab-active-height: clamp(62px, 5.2vw, 78px); --miku-tab-inactive-height: clamp(42px, 3.7vw, 57px); position: relative; top: -8px; z-index: 3; display: flex; align-items: flex-end; justify-content: center; gap: 8px; width: min(85.4%, 815px); max-width: 100%; height: var(--miku-tab-active-height); margin: 0 auto -8px; padding: 0; overflow: visible; border-radius: 0; background: transparent; box-shadow: none; scrollbar-width: none; }
      .miku-mode-tabs::-webkit-scrollbar { display: none; }
      .miku-mode-tabs::before { content: none; }
      .miku-tab-indicator { display: none; }
      .miku-mode-tabs:not(.is-ready) .miku-tab-indicator { transition: none; }
      .miku-mode-tab { position: relative; z-index: 1; flex: 1 1 0; min-width: 0; min-height: var(--miku-tab-inactive-height); height: var(--miku-tab-inactive-height); padding: 0 20px; border: 0; border-radius: 18px 18px 0 0; background: linear-gradient(180deg, #edf0f9 0%, rgba(250, 251, 255, .24) 100%); color: #697174; display: inline-flex; align-items: center; justify-content: flex-start; gap: 8px; white-space: nowrap; font-size: 14px; font-weight: 500; line-height: 20px; box-shadow: none; transition: flex-grow .28s cubic-bezier(.4, 0, .2, 1), height .28s cubic-bezier(.4, 0, .2, 1), color .18s ease, font-size .28s cubic-bezier(.4, 0, .2, 1), font-weight .28s cubic-bezier(.4, 0, .2, 1); }
      .miku-mode-tab::before { content: none; }
      .miku-mode-tab::after { content: ""; position: absolute; top: 2px; left: var(--miku-mode-english-inset, 20px); z-index: 1; color: rgba(255, 255, 255, .68); font-size: clamp(24px, 1.9vw, 30px); font-weight: 500; letter-spacing: .02em; line-height: 1; white-space: nowrap; text-shadow: none; -webkit-text-stroke: 0 transparent; pointer-events: none; transform: none; transition: top .28s cubic-bezier(.4, 0, .2, 1); }
      .miku-mode-tab:nth-of-type(1)::after { content: "PLAN"; left: var(--miku-mode-english-inset, 20px); }
      .miku-mode-tab:nth-of-type(2)::after { content: "IMAGE"; left: var(--miku-mode-english-inset, 20px); }
      .miku-mode-tab:nth-of-type(3)::after { content: "VIDEO"; left: var(--miku-mode-english-inset, 20px); }
      .miku-mode-tab:focus { outline: none; }
      .miku-mode-icon { width: 16px; height: 16px; flex: 0 0 auto; color: currentColor; transition: width .28s cubic-bezier(.4, 0, .2, 1), height .28s cubic-bezier(.4, 0, .2, 1); }
      .miku-mode-icon svg, .miku-mode-icon img { width: 16px; height: 16px; transition: width .28s cubic-bezier(.4, 0, .2, 1), height .28s cubic-bezier(.4, 0, .2, 1); }
      .miku-mode-tab > *:not(.miku-mode-background):not(.miku-mode-detail):not(.miku-mode-illustration):not(.miku-mode-indicator) { position: relative; z-index: 2; transition: transform .28s cubic-bezier(.4, 0, .2, 1); }
      .miku-mode-indicator { display: none; }
      .miku-mode-indicator svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .miku-mode-indicator linearGradient[id*="fill"] stop:first-child { stop-color: #e4eaff; }
      .miku-mode-indicator linearGradient[id*="fill"] stop:last-child { stop-color: rgba(248, 249, 255, .06); }
      .miku-mode-indicator path[fill="none"] { stroke: none; }
      .miku-mode-shape-active linearGradient[id*="fill"] stop:first-child { stop-color: #d9e3ff; }
      .miku-mode-shape-active linearGradient[id*="fill"] stop:last-child { stop-color: rgba(241, 243, 255, .08); }
      .miku-mode-shape-active { opacity: 0; }
      .miku-mode-tab.is-active .miku-mode-shape-idle { opacity: 0; }
      .miku-mode-tab.is-active .miku-mode-shape-active { opacity: 1; }
      .miku-mode-illustration { position: absolute; top: -18px; right: 2px; z-index: 0; display: block; width: min(160px, 72%); height: 80px; object-fit: contain; opacity: 0; transform: translate(0, 8px); filter: drop-shadow(0 6px 8px rgba(22, 34, 53, .1)); transition: opacity .2s ease, transform .28s var(--ease); pointer-events: none; }
      .miku-mode-tab:not(.is-active):hover { color: #697174; }
      .miku-mode-tab.is-active { z-index: 2; flex-grow: 1.45; height: var(--miku-tab-active-height); background: linear-gradient(180deg, #e6ecfb 0%, rgba(247, 249, 255, .2) 100%); color: #4c60b3; font-weight: 600; }
      .miku-mode-tab.is-active::after { top: 7px; }
      .miku-mode-tab.is-active:nth-of-type(1)::after { left: var(--miku-mode-english-inset, 20px); }
      .miku-mode-tab.is-active:nth-of-type(2)::after { left: var(--miku-mode-english-inset, 20px); }
      .miku-mode-tab.is-active:nth-of-type(3)::after { left: var(--miku-mode-english-inset, 20px); }
      .miku-mode-tab:not(.is-active) > *:not(.miku-mode-background):not(.miku-mode-detail):not(.miku-mode-illustration):not(.miku-mode-indicator) { transform: none; }
      .miku-mode-tab.is-active { font-size: 16px; }
      .miku-mode-tab.is-active .miku-mode-icon, .miku-mode-tab.is-active .miku-mode-icon svg, .miku-mode-tab.is-active .miku-mode-icon img { width: 18px; height: 18px; }
      .miku-mode-tab.is-active > *:not(.miku-mode-background):not(.miku-mode-detail):not(.miku-mode-illustration):not(.miku-mode-indicator) { transform: translateY(-4px); }
      .miku-mode-tab.is-active .miku-mode-illustration { opacity: 1; transform: translate(0, 0); }
      .miku-mode-tab:nth-of-type(3) .miku-mode-illustration { filter: saturate(.44) brightness(1.08) contrast(.9) drop-shadow(0 6px 8px rgba(22, 34, 53, .1)); }
      .miku-mode-tab.is-active:nth-of-type(3) .miku-mode-illustration { opacity: .78; }
      .miku-mode-detail { display: none; }
      .miku-mode-detail::before { content: ""; display: block; width: 100%; height: 1px; background: rgba(108, 140, 244, .28); }
      .miku-mode-background { display: none; }
      .miku-question-box { position: relative; z-index: 2; min-height: 132px; padding: 16px 20px; border: 1.6px solid rgba(210, 219, 233, .96); border-bottom: 0; border-radius: 28px; background: var(--surface); box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .miku-composer-tab { position: absolute; top: 18px; left: 20px; z-index: 1; display: inline-flex; align-items: center; height: 20px; padding: 0 5px; border: 1px solid rgba(125, 132, 139, .42); border-radius: 10px; color: #7b8388; font-size: 14px; line-height: 1; }
      .miku-question-placeholder { position: absolute; top: 17px; left: 66px; right: 20px; z-index: 1; overflow: hidden; color: #929c9d; font-size: 15px; line-height: 22px; white-space: nowrap; text-overflow: ellipsis; pointer-events: none; transition: opacity .2s ease, transform .2s var(--ease); }
      .miku-question-placeholder.is-changing { opacity: 0; transform: translateY(-3px); }
      .miku-question-placeholder.is-hidden { opacity: 0; visibility: hidden; }
      .miku-question-input { position: relative; z-index: 2; display: block; width: 100%; min-height: 96px; padding: 2px 0 0 46px; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 15px; line-height: 1.5; }
      .miku-question-input:focus-visible { outline: 0; }
      .miku-question-input::placeholder { color: transparent; opacity: 0; font-size: 15px; }
      .miku-composer-actions { position: relative; z-index: 3; display: flex; align-items: center; justify-content: flex-start; gap: 14px; height: var(--miku-action-row-height); margin: 0; background: transparent; }
      .miku-composer-actions::before { content: none; }
      .miku-composer-actions-left { position: relative; z-index: 1; min-width: 0; display: flex; align-items: center; gap: 0; padding: 0 0 0 8px; overflow-x: auto; border: 0; border-radius: 0; background: transparent; box-shadow: none; scrollbar-width: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
      .miku-composer-actions-left::-webkit-scrollbar { display: none; }
      .miku-action-button { min-height: 26px; padding: 4px 8px; border: 0; border-radius: 0; background: transparent; color: #667176; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12px; font-weight: 500; line-height: 14.4px; box-shadow: none; transition: color .2s ease, transform .2s var(--ease); }
      .miku-action-button:hover { background: transparent; color: var(--ink); transform: none; }
      .miku-model-button { color: #667176; }
      .miku-action-divider { display: block; width: 1px; height: 20px; flex: 0 0 auto; background: rgba(105, 118, 119, .28); }
      #modelButton > .icon-slot:first-child,
      #settingsButton > .icon-slot:first-child,
      #uploadButton > .icon-slot:first-child { width: 16px; height: 16px; }
      #modelButton > .icon-slot:last-child { width: 14px; height: 14px; }
      .miku-send-button-wrap { position: absolute; top: 50%; right: 24px; z-index: 4; width: 54px; height: 26px; border-radius: 999vw; background: transparent; pointer-events: none; transform: translateY(-50%); }
      .miku-send-button { all: unset; cursor: pointer; position: relative; box-sizing: border-box; width: 100%; height: 100%; min-width: 0; padding: 0; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); pointer-events: auto; z-index: 3; display: inline-flex; align-items: center; justify-content: center; background: rgba(84, 107, 218, .86); border: 0; border-radius: 999vw; color: #fff; box-shadow: 0 5px 14px rgba(84, 107, 218, .24), 0 0 14px rgba(84, 107, 218, .08); transition: none; }
      .miku-send-button-label { position: relative; z-index: 2; display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding: 0; user-select: none; -webkit-user-select: none; color: #fff; }
      .miku-send-button .icon-slot { position: relative; z-index: 3; width: 14px; height: 14px; color: #fff; }
      .miku-send-button .icon-slot svg { color: #fff; stroke: none; fill: currentColor; }

      .template-library { width: 100%; margin: auto auto 0; }
      .template-library-header { display: flex; align-items: center; gap: 24px; margin-bottom: 14px; }
      .template-tabs { min-width: 0; display: flex; align-items: center; gap: 25px; overflow: hidden; }
      .template-tab, .template-more { padding: 0; border: 0; background: transparent; color: var(--ink-soft); white-space: nowrap; font-size: 14px; transition: color .2s ease, transform .2s var(--ease); }
      .template-tab:hover, .template-more:hover { color: var(--ink); transform: translateY(-1px); }
      .template-tab.is-active { color: var(--ink); font-size: 17px; font-weight: 720; }
      .template-more { margin-left: auto; color: #7c878a; }
      .template-more span { display: inline-block; margin-left: 3px; font-size: 19px; line-height: 0; transform: translateY(2px); }
      .template-grid { display: flex; gap: 14px; overflow-x: auto; padding: 0 2px 6px; scrollbar-width: none; scroll-behavior: smooth; }
      .template-grid::-webkit-scrollbar { display: none; }
      .template-card { flex: 0 0 clamp(180px, 15vw, 232px); min-width: 0; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 17px; background: #f5f7f5; color: var(--ink); text-align: left; transition: border-color .2s ease; }
      .template-card:hover { border-color: var(--line); }
      .template-card-media { position: relative; display: block; aspect-ratio: 1.28; padding: 9px; background: #eef1ef; }
      .template-card-media img { display: block; width: 100%; height: 100%; border-radius: 11px; object-fit: cover; }
      .template-card-cta { position: absolute; left: 50%; bottom: 16px; z-index: 1; display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 0 18px; border: 1px solid rgba(255, 255, 255, .32); border-radius: 999px; background: rgba(255, 255, 255, .38); color: #35446d; font-size: 12px; font-weight: 650; line-height: 1; opacity: 0; pointer-events: none; transform: translate(-50%, 5px); box-shadow: 0 4px 12px rgba(22, 34, 53, .10), inset 0 1px 0 rgba(255, 255, 255, .24); backdrop-filter: blur(10px) saturate(1.08); -webkit-backdrop-filter: blur(10px) saturate(1.08); transition: opacity .18s ease, transform .18s var(--ease); }
      .template-card:hover .template-card-cta, .template-card:focus-visible .template-card-cta { opacity: 1; transform: translate(-50%, 0); }
      .template-card-title { display: block; overflow: hidden; padding: 10px 12px 12px; font-size: 12px; font-weight: 620; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }

      @media (min-width: 1500px) {
        .template-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); overflow: visible; }
        .template-card { flex-basis: auto; }
      }

      .toast { position: fixed; left: 50%; bottom: 24px; z-index: 10; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: rgba(17, 26, 32, .94); color: #fff; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .24s ease, transform .24s var(--ease); }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 900px) {
        .sidebar { width: 184px; flex-basis: 184px; padding-left: 14px; padding-right: 14px; }
        .workspace { padding-left: 24px; padding-right: 24px; }
        .miku-composer-section { width: min(calc(100% - 48px), 860px); }
      }

      @media (min-width: 701px) and (max-height: 780px) {
        .workspace { padding-top: 18px; padding-bottom: 16px; }
        .topbar { min-height: 40px; }
        .hero { padding-top: 26px; }
        .hero-orb { width: 54px; height: 46px; margin-bottom: 12px; }
        .hero h1 { font-size: 32px; }
        .hero p { margin-top: 8px; font-size: 12px; }
        .miku-composer-section { --miku-row-height: 36px; margin-top: 88px; }
        .miku-mode-tabs { --miku-tab-active-height: 72px; --miku-tab-inactive-height: 42px; gap: 8px; }
        .miku-mode-tab { padding: 0 16px; gap: 8px; font-size: 14px; }
        .miku-mode-detail { left: 16px; right: 16px; bottom: 14px; }
        .miku-mode-tab.is-active > *:not(.miku-mode-background):not(.miku-mode-detail):not(.miku-mode-illustration):not(.miku-mode-indicator) { transform: translateY(-3px); }
        .miku-mode-icon, .miku-mode-icon svg, .miku-mode-icon img { width: 15px; height: 15px; }
        .miku-question-box { min-height: 120px; padding-top: 15px; padding-bottom: 15px; }
        .miku-question-input { min-height: 90px; }
        .template-library-header { gap: 18px; margin-bottom: 10px; }
        .template-tabs { gap: 17px; }
        .template-tab, .template-more { font-size: 12px; }
        .template-tab.is-active { font-size: 15px; }
        .template-grid { gap: 10px; }
        .template-card-media { padding: 7px; }
        .template-card-title { padding: 8px 9px 10px; font-size: 11px; }
      }

      @media (max-width: 700px) {
        .app-shell { display: block; overflow: visible; }
        .sidebar { width: 100%; min-height: auto; padding: 15px 16px; border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; gap: 12px; }
        .brand-row { flex: 0 0 auto; }
        .side-section, .sidebar-bottom { display: none; }
        .workspace { min-height: calc(100dvh - 67px); padding: 18px 16px 24px; }
        .topbar { min-height: 40px; }
        .hero { padding-top: 48px; }
        .miku-composer-section { --miku-row-height: 40px; width: 100%; margin-top: 64px; }
        .miku-mode-tabs { --miku-tab-active-height: 62px; --miku-tab-inactive-height: 36px; width: 100%; margin-left: 0; gap: 5px; padding: 0 1px; }
        .miku-mode-tab { --miku-mode-english-inset: 10px; min-width: 0; flex: 1 1 0; padding: 0 10px; gap: 5px; font-size: 13px; white-space: nowrap; }
        .miku-mode-tab.is-active > *:not(.miku-mode-background):not(.miku-mode-detail):not(.miku-mode-illustration):not(.miku-mode-indicator) { transform: translateY(-2px); }
        .miku-mode-detail { left: 10px; right: 10px; bottom: 10px; font-size: 10px; line-height: 14px; }
        .miku-mode-icon, .miku-mode-icon svg, .miku-mode-icon img { width: 16px; height: 16px; }
        .miku-question-box { min-height: 150px; padding: 17px; }
        .miku-question-input { min-height: 108px; font-size: 14px; }
        .miku-composer-actions { gap: 8px; }
        .miku-composer-actions-left { padding-left: 4px; padding-right: 4px; }
        .miku-action-button { padding-left: 9px; padding-right: 9px; }
        .miku-send-button-wrap { right: 18px; width: 48px; height: 24px; }
        .skill-strip { width: 100%; margin-top: 14px; overflow-x: auto; padding: 0 2px 6px; scrollbar-width: none; }
        .skill-strip::-webkit-scrollbar { display: none; }
        .skill-card { min-height: 36px; }
        .skill-more { width: 36px; min-width: 36px; min-height: 36px; }
        .template-library { margin-top: 42px; }
        .template-library-header { overflow-x: auto; gap: 14px; }
        .template-tabs { gap: 16px; }
        .template-grid { gap: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .miku-mode-tab { transition: color .18s ease; }
        .miku-mode-tab::before, .miku-mode-tab::after, .miku-mode-detail { transition: none; }
        .miku-mode-icon, .miku-mode-icon svg, .miku-mode-icon img,
        .miku-mode-tab > *:not(.miku-mode-background):not(.miku-mode-detail):not(.miku-mode-illustration):not(.miku-mode-indicator) { transition: none; }
        .miku-mode-tab.is-active > *:not(.miku-mode-background):not(.miku-mode-detail):not(.miku-mode-illustration):not(.miku-mode-indicator) { transform: none; }
      }

      function normalizeIconVisualSize() {
        document.querySelectorAll('.icon-slot > svg').forEach((svg) => {
          const viewBox = svg.viewBox.baseVal;
          const shapes = [
            ...svg.querySelectorAll(
              'path, circle, rect, line, polyline, polygon, ellipse'
            )
          ];

          if (!shapes.length || !viewBox.width || !viewBox.height) return;

          // 仅统计“实际可见”的图形：很多线性图标带一条 fill='none' 的 24x24
          // 装饰背景路径（如 M24 0v24H0V0z），不可见但会被 getBBox() 计入，
          // 导致所有图标都被测成 24x24。这里按 fill/stroke 是否可见过滤掉它。
          const isVisible = (shape) => {
            const cs = getComputedStyle(shape);
            const fill = cs.fill;
            const stroke = cs.stroke;
            return (
              (fill && fill !== 'none' && fill !== 'transparent') ||
              (stroke && stroke !== 'none' && stroke !== 'transparent')
            );
          };

          const boxes = shapes
            .filter(isVisible)
            .map((shape) => {
              try {
                return shape.getBBox();
              } catch {
                return null;
              }
            })
            .filter(Boolean);

          if (!boxes.length) return;

          const minX = Math.min(...boxes.map((box) => box.x));
          const minY = Math.min(...boxes.map((box) => box.y));
          const maxX = Math.max(...boxes.map((box) => box.x + box.width));
          const maxY = Math.max(...boxes.map((box) => box.y + box.height));

          const visualWidth = maxX - minX;
          const visualHeight = maxY - minY;
          const visualSize = Math.max(visualWidth, visualHeight);

          if (!visualSize) return;

          const scale = Math.min(1.2, Math.max(0.86, targetSize / visualSize));

          // 造成图标→文字的视觉间距不一致。这里把图形向右对齐到槽右缘，
          // 使每个图标的图形右缘与后面文字之间只保留 CSS gap，间距统一。
          const slot = svg.closest('.icon-slot');
          const slotW = slot ? slot.offsetWidth : 16;
          const renderW = slotW * (visualWidth / viewBox.width) * scale;
          const tx = (slotW - renderW) / 2;

          svg.style.transform = `translateX(${tx.toFixed(2)}px) scale(${scale})`;

        const { left, right, top, bottom, tabTop, tabStart, tabEnd } = geometry;
        const topRadius = Math.min(28, (right - left) / 2, (bottom - top) / 2);
        const tabRadius = Math.min(18, (tabEnd - tabStart) / 2, (top - tabTop) / 2);
        const join = Math.max(6, Math.min(18, tabStart - left, right - tabEnd));
        const q = (number) => Number(number.toFixed(2));
        return [
          `M ${q(left + topRadius)} ${q(top)}`,
          `L ${q(tabStart - join)} ${q(top)}`,
          `Q ${q(tabStart)} ${q(top)} ${q(tabStart)} ${q(top - join)}`,
          `L ${q(tabStart)} ${q(tabTop + tabRadius)}`,
          `Q ${q(tabStart)} ${q(tabTop)} ${q(tabStart + tabRadius)} ${q(tabTop)}`,
          `L ${q(tabEnd - tabRadius)} ${q(tabTop)}`,
          `Q ${q(tabEnd)} ${q(tabTop)} ${q(tabEnd)} ${q(tabTop + tabRadius)}`,
          `L ${q(tabEnd)} ${q(top - join)}`,
          `Q ${q(tabEnd)} ${q(top)} ${q(tabEnd + join)} ${q(top)}`,
          `L ${q(right - topRadius)} ${q(top)}`,
          `Q ${q(right)} ${q(top)} ${q(right)} ${q(top + topRadius)}`,
          `L ${q(right)} ${q(bottom - topRadius)}`,
          `Q ${q(right)} ${q(bottom)} ${q(right - topRadius)} ${q(bottom)}`,
          `L ${q(left + topRadius)} ${q(bottom)}`,
          `Q ${q(left)} ${q(bottom)} ${q(left)} ${q(bottom - topRadius)}`,
          `L ${q(left)} ${q(top + topRadius)}`,
          `Q ${q(left)} ${q(top)} ${q(left + topRadius)} ${q(top)}`
        ].join(' ');
      };
      const renderOutline = (geometry) => {
        outlineSvg.setAttribute('viewBox', `0 0 ${geometry.sectionWidth} ${geometry.sectionHeight}`);
        surfaceSvg.setAttribute('viewBox', `0 0 ${geometry.sectionWidth} ${geometry.sectionHeight}`);
        const insetGeometry = {
          ...geometry,
          left: geometry.left + outlineInset,
          right: geometry.right - outlineInset,
          top: geometry.top + outlineInset,
          bottom: geometry.bottom - outlineInset,
          tabTop: geometry.tabTop + outlineInset,
          tabStart: geometry.tabStart + outlineInset,
          tabEnd: geometry.tabEnd - outlineInset
        };
        const outlineD = buildOutlinePath(insetGeometry);
        outlinePath.setAttribute('d', outlineD);
        surfacePath.setAttribute('d', outlineD);
      };
      const animateOutlineTo = (target, { initial = false } = {}) => {
        cancelAnimationFrame(outlineAnimationFrame);
        if (initial || !outlineGeometry) {
          outlineGeometry = target;
          renderOutline(target);
          return;
        }
        const from = outlineGeometry;
        const startedAt = performance.now();
        const tick = (now) => {
          const progress = Math.min(1, (now - startedAt) / outlineDuration);
          const eased = easeOutline(progress);
          const frame = Object.fromEntries(Object.keys(target).map((key) => [key, from[key] + (target[key] - from[key]) * eased]));
          outlineGeometry = frame;
          renderOutline(frame);
          if (progress < 1) outlineAnimationFrame = requestAnimationFrame(tick);
        };
        outlineAnimationFrame = requestAnimationFrame(tick);
      };
      const syncModeIndicator = ({ initial = false } = {}) => {
        const active = modeTabs.querySelector('.miku-mode-tab.is-active');
        if (!active) return;
        modeIndicator.style.transform = `translate3d(${active.offsetLeft}px, 0, 0)`;
        modeIndicator.style.width = `${active.offsetWidth}px`;
        animateOutlineTo(measureOutline(active), { initial });
        if (initial) {
          modeTabs.classList.remove('is-ready');
          requestAnimationFrame(() => modeTabs.classList.add('is-ready'));
        } else {
          modeTabs.classList.add('is-ready');
        }
      };
      modeTabItems.forEach((tab) => tab.addEventListener('click', () => {
        cancelAnimationFrame(modeSwitchFrame);
        modeSwitchFrame = requestAnimationFrame(() => {
          modeTabItems.forEach((item) => {
            const selected = item === tab;
            item.classList.toggle('is-active', selected);
            item.setAttribute('aria-selected', selected ? 'true' : 'false');
          });
          syncModeIndicator();
        });
      }));
      window.addEventListener('resize', () => syncModeIndicator());
      syncModeIndicator({ initial: true });
      document.querySelector('#upgradeButton').addEventListener('click', () => showToast('Pro plan is not connected in this copy'));
      document.querySelectorAll('.template-tab').forEach((tab) => tab.addEventListener('click', () => {
        document.querySelectorAll('.template-tab').forEach((item) => {
          item.classList.toggle('is-active', item === tab);
          item.setAttribute('aria-selected', item === tab ? 'true' : 'false');
        });
        showToast(`${tab.textContent.trim()} selected`);
      }));
      document.querySelectorAll('.template-card').forEach((card) => card.addEventListener('click', () => showToast(`${card.dataset.template} template selected`)));
      document.querySelector('#templateMore').addEventListener('click', () => showToast('More templates are coming soon'));
    </script>
  </body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<!-- Miku 米库 · 首页可编辑设计稿
     导入 Figma 后可按 Sidebar / Topbar / Hero / Composer / Cases 分组编辑。
     当前文件为 resting state；悬停与交互请使用本地 HTML 预览。 -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1440" height="1024" viewBox="0 0 1440 1024" fill="none">
  <defs>
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#26312A" flood-opacity="0.09"/>
    </filter>
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#26312A" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lifted" x="-25%" y="-25%" width="150%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#414F43" flood-opacity="0.18"/>
    </filter>
    <style>
      .ink { fill: #28312B; }
      .soft { fill: #68736B; }
      .faint { fill: #929B93; }
      .sage { fill: #718076; }
      .deep { fill: #5E6C62; }
      .line { stroke: #DFE5DF; }
      .hairline { stroke: #CFD8CF; }
      .text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
      .display { font-family: "Hanken Grotesk", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .icon { stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <g id="Miku_Homepage" data-name="Miku 首页">
    <rect id="Canvas" data-name="页面背景" width="1440" height="1024" fill="#F5F6F2"/>

    <!-- Sidebar -->
    <g id="Sidebar" data-name="Sidebar">
      <rect id="Sidebar_Surface" data-name="侧栏背景" width="256" height="1024" fill="#F9FAF7"/>
      <path id="Sidebar_Divider" data-name="侧栏分隔线" d="M255.5 0V1024" stroke="#CFD8CF"/>

      <g id="Brand" data-name="品牌">
        <rect x="28" y="28" width="40" height="40" rx="12" fill="#28312B"/>
        <g class="icon" style="color:#FFFEFB">
          <path d="M48 34v4M42.8 37l3.5 2M53.2 37l-3.5 2M43 45l3.5-2M53 45l-3.5-2"/>
          <circle cx="48" cy="32" r="2"/><circle cx="41" cy="36" r="2"/><circle cx="55" cy="36" r="2"/>
          <circle cx="41" cy="47" r="2"/><circle cx="55" cy="47" r="2"/><circle cx="48" cy="41" r="2"/>
        </g>
        <text x="80" y="57" class="display ink" font-size="26" font-weight="700" letter-spacing="-1.1">米库</text>
        <text x="30" y="91" class="text soft" font-size="13">全链路营销系统</text>
      </g>

      <g id="Primary_Navigation" data-name="主导航" class="text">
        <g id="Nav_Home" data-name="导航 / 首页">
          <rect x="16" y="122" width="224" height="52" rx="13" fill="#5E6C62" filter="url(#shadow-card)"/>
          <g class="icon" style="color:#FFFEFB">
            <rect x="35" y="140" width="6" height="6" rx="1"/><rect x="46" y="140" width="6" height="6" rx="1"/>
            <rect x="35" y="151" width="6" height="6" rx="1"/><rect x="46" y="151" width="6" height="6" rx="1"/>
          </g>
          <text x="72" y="155" fill="#FFFEFB" font-size="16">首页</text>
        </g>
        <g id="Nav_Templates" data-name="导航 / 模板">
          <g class="icon" style="color:#68736B">
            <rect x="35" y="199" width="6" height="6" rx="1"/><rect x="46" y="199" width="6" height="6" rx="1"/>
            <rect x="35" y="210" width="6" height="6" rx="1"/><path d="M49 209v8M45 213h8"/>
          </g>
          <text x="72" y="214" fill="#68736B" font-size="16">模板</text>
        </g>
        <g id="Nav_Tools" data-name="导航 / 工具">
          <path class="icon" style="color:#68736B" d="m46.7 257.3 3-3a5 5 0 0 0-6.5 6.5l-6.7 6.7a2.1 2.1 0 1 0 3 3l6.7-6.7a5 5 0 0 0 6.5-6.5l-3 3-3-3Z"/>
          <text x="72" y="273" fill="#68736B" font-size="16">工具</text>
        </g>
        <g id="Nav_Tasks" data-name="导航 / 任务">
          <rect x="35" y="291" width="18" height="20" rx="3" class="icon" style="color:#68736B"/>
          <path class="icon" style="color:#68736B" d="M40 291.5h8M39 301l3 3 6-6"/>
          <text x="72" y="306" fill="#68736B" font-size="16">任务</text>
        </g>
        <g id="Nav_Profile" data-name="导航 / 我的">
          <circle cx="44" cy="350" r="9" class="icon" style="color:#68736B"/>
          <circle cx="44" cy="347" r="2.5" class="icon" style="color:#68736B"/>
          <path class="icon" style="color:#68736B" d="M39.5 356a4.5 4.5 0 0 1 9 0"/>
          <text x="72" y="355" fill="#68736B" font-size="16">我的</text>
        </g>
      </g>

      <g id="Recent" data-name="最近任务" class="text">
        <path d="M30 414H226" stroke="#DFE5DF"/>
        <text x="30" y="445" class="faint" font-size="13">最近</text>
        <text x="48" y="486" class="soft" font-size="14">季度营销分析报告</text>
        <text x="48" y="528" class="soft" font-size="14">小红书投放策略</text>
      </g>

      <g id="Profile_Card" data-name="个人信息卡">
        <rect x="16" y="948" width="224" height="60" rx="14" fill="#EEF1EC" stroke="#DFE5DF"/>
        <circle cx="48" cy="978" r="17" fill="#28312B"/>
        <circle cx="48" cy="974" r="3" class="icon" style="color:#FFFEFB"/>
        <path d="M41 988a7 7 0 0 1 14 0" class="icon" style="color:#FFFEFB"/>
        <text x="72" y="973" class="text ink" font-size="13" font-weight="600">首席营销官</text>
        <text x="72" y="991" class="text soft" font-size="12">专业版会员</text>
        <g class="icon" style="color:#68736B">
          <path d="M191 969h9M191 987h9"/><circle cx="196" cy="969" r="2"/><circle cx="195" cy="987" r="2"/>
        </g>
      </g>
    </g>

    <!-- Topbar -->
    <g id="Topbar" data-name="顶部栏">
      <rect x="256" width="1184" height="80" fill="#F9FAF7" fill-opacity=".78"/>
      <path d="M256 79.5H1440" stroke="#DFE5DF"/>
      <g id="Search" data-name="搜索">
        <circle cx="321" cy="34" r="7" class="icon" style="color:#28312B"/>
        <path d="m326 39 5 5" class="icon" style="color:#28312B"/>
        <text x="354" y="40" class="text ink" font-size="15">搜索功能、数据或模板...</text>
      </g>
      <g id="Top_Actions" data-name="顶部操作">
        <path d="M1250 30a6 6 0 0 1 12 0c0 7 2 7 2 7h-16s2 0 2-7ZM1254 43h4" class="icon" style="color:#28312B"/>
        <circle cx="1276" cy="31" r="4" fill="#9A6F54"/>
        <circle cx="1320" cy="34" r="17" fill="#28312B"/>
        <circle cx="1320" cy="30" r="3.2" class="icon" style="color:#FFFEFB"/>
        <path d="M1313 41a7 7 0 0 1 14 0" class="icon" style="color:#FFFEFB"/>
      </g>
    </g>

    <!-- Main content -->
    <g id="Main_Content" data-name="主内容">
      <!-- Hero -->
      <g id="Hero" data-name="Hero">
        <text x="848" y="178" text-anchor="middle" class="display ink" font-size="48" font-weight="700" letter-spacing="-2.1">从营销想法到落地，一站式交付</text>
        <text x="848" y="224" text-anchor="middle" class="text soft" font-size="17">将复杂的营销策略转化为可执行的智能方案，让创意落地更简单。</text>
      </g>

      <!-- Composer / resting state only -->
      <g id="Composer" data-name="创作区">
        <g id="Mode_Deck" data-name="生成模式卡组">
          <g id="Mode_Agent" data-name="模式 / Agent" transform="translate(510 284) rotate(-4 110 70)">
            <rect width="220" height="126" rx="18" fill="#FFFEFB" stroke="#DFE5DF" filter="url(#shadow-card)"/>
            <g transform="translate(91 37)" class="icon" style="color:#718076">
              <rect x="-8" y="-5" width="16" height="12" rx="3"/><path d="M0-9v4M-5 1h.01M5 1h.01M-5 7v3M5 7v3"/>
            </g>
            <text x="110" y="84" text-anchor="middle" class="text ink" font-size="16">Agent模式</text>
          </g>
          <g id="Mode_Video" data-name="模式 / 视频生成" transform="translate(970 284) rotate(4 110 70)">
            <rect width="220" height="126" rx="18" fill="#FFFEFB" stroke="#DFE5DF" filter="url(#shadow-card)"/>
            <rect x="98" y="29" width="25" height="22" rx="3" class="icon" style="color:#718076"/>
            <path d="m98 35 6-6M108 35l6-6M118 35l5-6M107 35l8 4-8 4v-8Z" class="icon" style="color:#718076"/>
            <text x="110" y="84" text-anchor="middle" class="text ink" font-size="16">视频生成</text>
          </g>
          <g id="Mode_Image" data-name="模式 / 图片生成" transform="translate(738 266)">
            <rect width="220" height="150" rx="18" fill="#FFFEFB" stroke="#CFD8CF" filter="url(#shadow-lifted)"/>
            <rect x="97" y="31" width="26" height="22" rx="3" class="icon" style="color:#718076"/>
            <circle cx="104" cy="37" r="2" class="icon" style="color:#718076"/>
            <path d="m99 50 7-6 5 4 3-3 7 5" class="icon" style="color:#718076"/>
            <text x="110" y="85" text-anchor="middle" class="display ink" font-size="17" font-weight="600">图片生成</text>
          </g>
        </g>

        <g id="Prompt_Composer" data-name="输入框容器">
          <rect x="340" y="386" width="1016" height="310" rx="23" fill="#FFFEFB" stroke="#D7DFD7" filter="url(#shadow-soft)"/>
          <rect x="351" y="397" width="994" height="288" rx="17" fill="none" stroke="#EEF1EC" stroke-width="2"/>
          <text x="377" y="435" class="text" fill="#929B93" font-size="17">请告诉我你的想法</text>
          <g id="Prompt_Tools" data-name="输入框工具">
            <rect x="376" y="624" width="50" height="50" rx="12" fill="#FFFEFB" stroke="#DFE5DF"/>
            <path d="M393 649.5 405.5 637a3.5 3.5 0 0 1 5 5l-8 8a5 5 0 0 1-7-7l8-8" class="icon" style="color:#68736B"/>
            <rect x="440" y="624" width="50" height="50" rx="12" fill="#FFFEFB" stroke="#DFE5DF"/>
            <path d="M452 638h8M470 638h8M452 660h5M467 660h11" class="icon" style="color:#68736B"/>
            <circle cx="463" cy="638" r="2" class="icon" style="color:#68736B"/><circle cx="462" cy="660" r="2" class="icon" style="color:#68736B"/>
          </g>
          <g id="Send_Button" data-name="发送按钮">
            <circle cx="1286" cy="649" r="30" fill="#5E6C62" filter="url(#shadow-card)"/>
            <path d="m1274 637 24 12-24 12 5.3-12-5.3-12Z" class="icon" style="color:#FFFEFB;stroke-width:1.6"/>
            <path d="M1279.5 649H1298" class="icon" style="color:#FFFEFB;stroke-width:1.6"/>
          </g>
        </g>
      </g>

      <!-- Cases -->
      <g id="Cases" data-name="热门案例">
        <text x="308" y="770" class="display ink" font-size="26" font-weight="600">热门案例</text>
        <text x="308" y="798" class="text soft" font-size="14">发现经过市场验证的成功营销路径</text>
        <text x="1300" y="786" text-anchor="end" class="text soft" font-size="14">查看模板库</text>
        <path d="m1310 780 6 6-6 6" class="icon" style="color:#68736B"/>

        <g id="Case_Grid" data-name="案例卡片组">
          <g id="Case_Brand" data-name="案例 / 品牌账号起号方案">
            <rect x="308" y="828" width="245" height="178" rx="16" fill="#FFFEFB" stroke="#DFE5DF" filter="url(#shadow-card)"/>
            <rect x="332" y="852" width="42" height="42" rx="11" fill="#EEF1EC"/>
            <path d="M339 870h28M340 870l3-8h20l3 8M341 870v13h27v-13M347 870v4M355 870v4M363 870v4" class="icon" style="color:#5E6C62"/>
            <text x="332" y="933" class="display ink" font-size="17" font-weight="600">品牌账号起号方案</text>
            <text x="332" y="966" class="text soft" font-size="13">从0到1构建品牌矩阵，</text>
            <text x="332" y="987" class="text soft" font-size="13">包含内容规划与增长策略。</text>
          </g>
          <g id="Case_Product" data-name="案例 / 产品种草活动">
            <rect x="573" y="828" width="245" height="178" rx="16" fill="#FFFEFB" stroke="#DFE5DF" filter="url(#shadow-card)"/>
            <rect x="597" y="852" width="42" height="42" rx="11" fill="#EEF1EC"/>
            <path d="M631 868.5c0 8-12 15-12 15s-12-7-12-15A6.5 6.5 0 0 1 619 865a6.5 6.5 0 0 1 12 3.5Z" class="icon" style="color:#5E6C62"/>
            <text x="597" y="933" class="display ink" font-size="17" font-weight="600">产品种草活动</text>
            <text x="597" y="966" class="text soft" font-size="13">精准触达目标圈层，小红</text>
            <text x="597" y="987" class="text soft" font-size="13">书/抖音双端高潜内容打造。</text>
          </g>
          <g id="Case_Launch" data-name="案例 / 新品上市">
            <rect x="838" y="828" width="245" height="178" rx="16" fill="#FFFEFB" stroke="#DFE5DF" filter="url(#shadow-card)"/>
            <rect x="862" y="852" width="42" height="42" rx="11" fill="#EEF1EC"/>
            <path d="M881 867c4-4 8-4 10-4 0 2 0 6-4 10l-7 7-6-6 7-7Z" class="icon" style="color:#5E6C62"/>
            <path d="m873 873-7 2 5 5-2 7 7-5M884 871l-3 3M871 891l-3 3" class="icon" style="color:#5E6C62"/>
            <text x="862" y="933" class="display ink" font-size="17" font-weight="600">新品上市</text>
            <text x="862" y="966" class="text soft" font-size="13">全生命周期造势营销，引爆</text>
            <text x="862" y="987" class="text soft" font-size="13">首发日销量峰值。</text>
          </g>
          <g id="Case_Store" data-name="案例 / 门店推广方案">
            <rect x="1103" y="828" width="245" height="178" rx="16" fill="#FFFEFB" stroke="#DFE5DF" filter="url(#shadow-card)"/>
            <rect x="1127" y="852" width="42" height="42" rx="11" fill="#EEF1EC"/>
            <path d="M1161 866c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0Z" class="icon" style="color:#5E6C62"/>
            <circle cx="1152" cy="866" r="2.4" class="icon" style="color:#5E6C62"/>
            <text x="1127" y="933" class="display ink" font-size="17" font-weight="600">门店推广方案</text>
            <text x="1127" y="966" class="text soft" font-size="13">LBS精准定向引流，打通线</text>
            <text x="1127" y="987" class="text soft" font-size="13">上线下的转化闭环。</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miku 米库 · 营销工作台</title>
    <style>
      :root { --mint:#66d5c2; --mint-strong:#35b7a6; --mint-soft:#e4f7f2; --orange:#f49337; --ink:#17211f; --muted:#84908c; --line:#dfe4e1; --surface:#fff; --canvas:#f4f5f3; --sidebar:#eceeec; --shadow:0 18px 42px rgba(47,68,61,.11); --ease:cubic-bezier(.16,1,.3,1); }
      * { box-sizing:border-box; }
      html { scroll-behavior:smooth; }
      body { min-height:100dvh; margin:0; color:var(--ink); background:var(--canvas); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
      button,textarea { font:inherit; } button,a { -webkit-tap-highlight-color:transparent; } button { cursor:pointer; } a { color:inherit; text-decoration:none; }
      :focus-visible { outline:3px solid rgba(53,183,166,.42); outline-offset:3px; }
      .icon { display:block; width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .icon-glyph { display:inline-flex; width:22px; height:22px; align-items:center; justify-content:center; font-size:0; }
      .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

      .sidebar { position:fixed; inset:0 auto 0 0; z-index:10; width:248px; display:flex; flex-direction:column; padding:22px 12px 14px; background:var(--sidebar); border-right:1px solid #e1e4e2; }
      .brand { display:flex; align-items:center; gap:10px; padding:0 10px 28px; }
      .brand-logo { width:42px; height:42px; display:block; border-radius:12px; object-fit:cover; }
      .brand-lockup { line-height:1; }
      .brand-name { display:block; font-size:24px; font-weight:800; letter-spacing:-.08em; }
      .brand-subtitle { display:block; margin-top:5px; color:#7b8581; font-size:9px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
      .side-label { margin:0 14px 9px; color:#929b97; font-size:12px; }
      .nav { display:grid; gap:4px; }
      .nav-link { min-height:42px; display:flex; align-items:center; gap:12px; padding:0 14px; border:0; border-radius:13px; color:#53605b; background:transparent; font-size:14px; text-align:left; transition:background 180ms var(--ease),color 180ms var(--ease),transform 180ms var(--ease); }
      .nav-link:hover { color:var(--ink); background:rgba(255,255,255,.56); transform:translateX(2px); }
      .nav-link[aria-current="page"] { color:#2d665c; background:#fff; box-shadow:0 4px 12px rgba(53,77,69,.07); }
      .nav-link .icon { color:#64716c; } .nav-link[aria-current="page"] .icon { color:var(--mint-strong); }
      .projects { margin:27px 4px 0; padding:22px 4px 0; border-top:1px solid #dce1de; }
      .projects-heading { display:flex; align-items:center; justify-content:space-between; padding:0 10px; }
      .projects-heading .side-label { margin:0; }
      .project-actions { display:flex; gap:2px; }
      .tiny-button,.profile-settings { display:grid; place-items:center; padding:0; border:0; border-radius:8px; color:#68736e; background:transparent; }
      .tiny-button { width:24px; height:24px; } .tiny-button:hover,.profile-settings:hover { color:var(--mint-strong); background:#fff; }
      .tiny-button .icon { width:16px; height:16px; }
      .project-item { display:flex; align-items:center; gap:9px; width:100%; margin-top:7px; padding:10px; border:0; border-radius:10px; color:#66736d; background:transparent; font-size:13px; text-align:left; }
      .project-item:hover { color:var(--ink); background:rgba(255,255,255,.56); }
      .project-dot { width:8px; height:8px; flex:0 0 auto; border-radius:50%; background:var(--mint); }
      .side-footer { margin-top:auto; }
      .credit-panel { margin:0 0 14px; padding:15px 13px 13px; border:1px solid rgba(255,255,255,.85); border-radius:16px; background:rgba(255,255,255,.7); box-shadow:0 5px 16px rgba(52,70,64,.04); }
      .credit-line { display:flex; align-items:center; justify-content:space-between; color:#68746f; font-size:12px; }
      .credit-line strong { color:var(--ink); font-size:13px; } .credit-copy { display:inline-flex; align-items:center; }
      .credit-copy .icon { width:15px; height:15px; margin-right:4px; color:var(--orange); }
      .upgrade-button { width:100%; height:32px; margin-top:12px; border:0; border-radius:999px; color:#fff; background:var(--orange); font-size:12px; font-weight:700; transition:transform 160ms var(--ease),filter 160ms var(--ease); }
      .upgrade-button:hover { filter:brightness(1.04); transform:translateY(-2px); }
      .profile-card { display:flex; align-items:center; gap:9px; padding:4px 7px; color:#59645f; }
      .profile-avatar,.top-avatar { object-fit:cover; border:2px solid #fff; border-radius:50%; }
      .profile-avatar { width:35px; height:35px; flex:0 0 auto; } .profile-copy { min-width:0; flex:1; line-height:1.2; }
      .profile-copy strong,.profile-copy span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .profile-copy strong { color:var(--ink); font-size:12px; } .profile-copy span { margin-top:4px; color:#7d8783; font-size:11px; }
      .profile-settings { width:28px; height:28px; } .profile-settings .icon { width:17px; height:17px; }

      .workspace { min-height:100dvh; margin-left:248px; }
      .topbar { height:68px; display:flex; align-items:center; justify-content:space-between; padding:0 44px; }
      .search-box { width:220px; height:38px; display:flex; align-items:center; gap:10px; padding:0 13px; border:1px solid #d8dedb; border-radius:999px; color:#8a9490; background:#fff; font-size:13px; text-align:left; transition:border-color 160ms var(--ease),box-shadow 160ms var(--ease); }
      .search-box:hover,.search-box:focus-visible { border-color:var(--mint-strong); box-shadow:0 0 0 4px rgba(53,183,166,.12); }
      .search-box .icon { width:17px; height:17px; color:#1c2925; }
      .crumb { display:inline-flex; align-items:center; gap:8px; color:#7c8782; font-size:12px; }
      .crumb-dot { width:7px; height:7px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 4px var(--mint-soft); }
      .top-actions { display:flex; align-items:center; gap:12px; } .top-button { display:grid; width:34px; height:34px; place-items:center; padding:0; border:0; border-radius:10px; color:#66716d; background:transparent; }
      .top-button:hover { color:var(--ink); background:#fff; } .top-button .icon { width:18px; height:18px; } .top-avatar { width:34px; height:34px; box-shadow:0 2px 6px rgba(35,52,46,.08); }
      .reference-crop { overflow:hidden; background-image:url('/reference/miku-home-reference.png'); background-repeat:no-repeat; background-size:1440px 1024px; }
      .top-avatar.reference-crop { display:block; padding:0; border:2px solid #fff; border-radius:50%; background-position:-1348px -15px; }
      .main { width:min(100% - 96px,848px); margin:0 auto; padding-bottom:64px; }

      .hero-card { position:relative; min-height:246px; display:flex; align-items:center; justify-content:center; padding:48px 24px 34px; border:0; border-radius:0; background:transparent; box-shadow:none; }
      .hero-copy { position:relative; z-index:2; max-width:100%; text-align:center; transform:translateY(-20px); } .hero-kicker,.hero-description,.hero-tabs,.hero-art-wrap { display:none; }
      .hero-title { margin:0; font-size:30px; line-height:1.12; letter-spacing:-.065em; font-weight:800; }
      .hero-title em { color:var(--ink); font-style:normal; }

      .composer-section { position:relative; z-index:0; margin-top:0; padding:2px; border:0; border-radius:20px; overflow:visible; background:radial-gradient(ellipse 56% 120% at 88% 90%,rgba(171,219,235,.42),transparent 60%),radial-gradient(ellipse 56% 120% at 45% 95%,rgba(250,214,185,.42),transparent 62%),#f0f0f0; backdrop-filter:blur(18px) saturate(105%); -webkit-backdrop-filter:blur(18px) saturate(105%); box-shadow:none; }
      .composer-panel { position:relative; z-index:1; overflow:visible; min-height:0; padding:0; border:0; border-radius:18px; background:transparent; box-shadow:none; }
      .composer-topline { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:31px; color:#f8fbfa; font-size:12px; } .prompt-guide { display:inline-flex; align-items:center; gap:8px; }
      .prompt-guide .icon { width:17px; height:17px; color:#fff; } .prompt-guide strong { color:#fff; font-size:12px; } .credit-upgrade { padding:4px 8px; border-radius:999px; color:#18362e; background:var(--mint); font-size:11px; font-weight:700; } .prompt-label { display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:999px; color:#1d302b; background:rgba(255,255,255,.72); font-size:11px; }
      .question-input-row { position:relative; z-index:2; display:flex; flex-direction:column; align-items:stretch; height:160px; min-height:160px; margin-top:0; padding:12px; background:#fff; border-radius:18px; box-shadow:none; }
      .prompt-input-area { display:flex; flex:1; min-height:0; flex-direction:column; }
      .prompt-topline { display:flex; align-items:flex-start; gap:8px; min-height:32px; }
      .prompt-caret { width:1px; height:28px; flex:0 0 1px; margin-top:1px; background:#202825; }
      .prompt-tab { display:inline-flex; align-items:center; justify-content:center; min-width:38px; height:28px; padding:0 8px; border:1px solid #d8ddda; border-radius:10px; color:#7c8581; background:#fff; font:12px/1 var(--font); }
      .prompt-input { flex:1; width:100%; height:72px; resize:none; margin:0; padding:3px 0 0; border:0; outline:0; color:var(--ink); background:transparent; font-size:14px; line-height:1.65; } .prompt-input::placeholder { color:#8b9490; }
      .composer-helper { position:absolute; top:82px; right:18px; display:grid; width:30px; height:30px; place-items:center; padding:0; border:0; border-radius:50%; color:#164c22; background:#45c84b; box-shadow:0 3px 8px rgba(40,110,48,.18); transition:transform 160ms var(--ease),filter 160ms var(--ease); } .composer-helper:hover { transform:translateY(-2px); filter:saturate(1.12); } .composer-helper .icon { width:17px; height:17px; }
      .question-input-actions { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:24px; }
      .composer-tools,.composer-actions { display:flex; align-items:center; gap:10px; }
      .question-input-actions .tool-button,.action-icon-button { display:inline-flex; align-items:center; justify-content:center; width:28px; height:30px; min-height:30px; padding:0; border:0; border-radius:8px; color:#303734; background:transparent; transition:color 160ms var(--ease),background 160ms var(--ease),transform 160ms var(--ease); }
      .question-input-actions .tool-button span:last-child { display:none; }
      .question-input-actions .tool-button:hover,.action-icon-button:hover { color:#111815; background:#f1f2f1; transform:translateY(-2px); } .question-input-actions .tool-button .icon,.action-icon-button .icon { width:21px; height:21px; }
      .auto-button { display:inline-flex; align-items:center; gap:7px; min-height:30px; padding:0 12px; border:0; border-radius:999px; color:#303734; background:#f0f1f0; font-size:12px; transition:background 160ms var(--ease),transform 160ms var(--ease); } .auto-button:hover { background:#e7e9e8; transform:translateY(-2px); } .auto-button .icon { width:16px; height:16px; }
      .send-button { display:grid; width:35px; height:35px; flex:0 0 auto; place-items:center; padding:0; border:0; border-radius:50%; color:#a4aaa8; background:#f0f1f0; box-shadow:none; transition:transform 160ms var(--ease),background 160ms var(--ease),color 160ms var(--ease); }
      .send-button:hover { color:#4d5652; background:#e7e9e8; transform:translateY(-2px); } .send-button:active { transform:scale(.95); } .send-button .icon { width:19px; height:19px; }
      .character-count { display:none; }
      .connector-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:42px; padding:0 14px; color:#2f3834; background:transparent; font-size:12px; }
      .connector-copy { display:inline-flex; align-items:center; gap:8px; } .connector-copy .icon { width:17px; height:17px; color:#303734; } .connector-list { display:flex; align-items:center; gap:6px; } .connector-chip { display:grid; width:28px; height:28px; place-items:center; border:1px solid rgba(255,255,255,.90); border-radius:8px; color:#28312e; background:rgba(255,255,255,.72); font-size:12px; font-weight:800; }
      .prompt-status { min-height:18px; margin:3px 0 0; color:var(--ink-soft); font-size:12px; } .prompt-status:empty { display:none; }

      .quick-section { margin-top:17px; } .quick-list { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px; } .quick-card { min-height:48px; display:flex; align-items:center; gap:9px; padding:0 12px; border:1px solid #e2e6e4; border-radius:13px; color:#5c6863; background:rgba(255,255,255,.66); font-size:12px; text-align:left; transition:border-color 160ms var(--ease),background 160ms var(--ease),transform 160ms var(--ease),box-shadow 160ms var(--ease); }
      .quick-card:hover,.quick-card.is-active { color:#2e6d61; border-color:#bde6dd; background:#f3fcfa; box-shadow:0 6px 14px rgba(54,119,105,.07); transform:translateY(-3px); } .quick-icon { display:grid; width:25px; height:25px; flex:0 0 auto; place-items:center; border-radius:8px; color:#367c6e; background:var(--mint-soft); } .quick-icon .icon { width:15px; height:15px; }

      .starter-section { margin-top:30px; } .section-heading { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:13px; } .section-heading h2 { margin:0; font-size:18px; letter-spacing:-.04em; } .section-heading p { margin:5px 0 0; color:#8b9691; font-size:12px; }
      .text-link { display:inline-flex; align-items:center; gap:4px; color:#7d8883; font-size:12px; } .text-link:hover { color:var(--mint-strong); } .text-link .icon { width:15px; height:15px; }
      .starter-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; } .starter-card { position:relative; min-height:116px; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:16px; border:1px solid #e2e6e4; border-radius:17px; background:#fff; text-align:left; transition:transform 180ms var(--ease),border-color 180ms var(--ease),box-shadow 180ms var(--ease); }
      .starter-card:after { content:""; position:absolute; right:-21px; bottom:-38px; width:100px; height:100px; border-radius:50%; background:var(--wash,#e9f8f4); } .starter-card:hover { border-color:#b8dfd6; box-shadow:0 8px 24px rgba(47,68,61,.08); transform:translateY(-4px); }
      .starter-card-top { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; color:#89938f; font-size:11px; } .starter-tag { padding:4px 7px; border-radius:6px; color:#367a6d; background:var(--wash,#e9f8f4); } .starter-card h3 { position:relative; z-index:1; max-width:180px; margin:12px 0 0; font-size:15px; line-height:1.35; letter-spacing:-.035em; } .starter-card p { position:relative; z-index:1; margin:8px 0 0; color:#86918d; font-size:11px; line-height:1.45; } .starter-card .icon { position:relative; z-index:1; width:17px; height:17px; color:#5b9e91; }
      .starter-card--mint { --wash:#e7f8f2; } .starter-card--peach { --wash:#fff0e3; } .starter-card--blue { --wash:#eaf2fa; } .footer-note { display:flex; justify-content:center; margin-top:45px; color:#a1aaa6; font-size:11px; }

      @media (max-width:1120px) { .sidebar{width:220px}.workspace{margin-left:220px}.topbar{padding-right:28px;padding-left:28px}.main{width:min(100% - 56px,848px)}.quick-list{grid-template-columns:repeat(3,minmax(0,1fr))} }
      @media (max-width:820px) { .sidebar{width:78px;align-items:center;padding:16px 9px 12px}.workspace{margin-left:78px}.brand{padding:0 0 25px}.brand-lockup,.side-label,.projects,.credit-panel,.profile-copy,.profile-settings,.nav-link span:last-child{display:none}.nav{width:100%}.nav-link{justify-content:center;padding:0}.profile-card{justify-content:center;padding:0}.topbar{padding:0 20px}.main{width:min(100% - 32px,700px)}.hero-card{min-height:210px;padding-right:23px;padding-left:23px}.hero-copy{max-width:100%}.starter-grid{grid-template-columns:1fr} }
      @media (max-width:620px) { .sidebar{position:static;width:100%;height:auto;display:flex;flex-direction:row;justify-content:space-between;padding:10px 14px;border-right:0;border-bottom:1px solid #e1e4e2}.brand{padding:0}.brand-logo{width:38px;height:38px}.brand-lockup{display:block}.brand-name{font-size:21px}.brand-subtitle{font-size:7px}.nav{width:auto;display:flex;gap:2px}.nav-link{width:37px;min-height:39px}.nav-link .icon{width:18px;height:18px}.workspace{margin-left:0}.topbar{height:56px;padding:0 16px}.search-box{width:188px;height:35px}.top-button{width:31px;height:31px}.main{width:calc(100% - 24px)}.hero-card{min-height:164px;padding:34px 16px 24px}.hero-copy{transform:translateY(-12px)}.hero-title{max-width:300px;font-size:30px}.composer-section{padding:0}.composer-panel{min-height:0}.prompt-input{height:96px;font-size:14px}.question-input-row{min-height:142px;margin-top:0;padding:16px 14px;border-radius:12px 12px 0 0}.composer-toolbar{align-items:flex-end;padding:10px 10px 9px;border-radius:0 0 12px 12px}.composer-tools{flex-wrap:wrap;max-width:220px}.composer-actions{gap:5px;align-items:center}.quick-list{display:flex;overflow-x:auto;gap:7px;padding-bottom:4px;scrollbar-width:none}.quick-list::-webkit-scrollbar{display:none}.quick-card{min-width:142px}.starter-section{margin-top:24px}.section-heading{align-items:flex-start}.section-heading h2{font-size:17px}.section-heading p{max-width:210px}.starter-grid{gap:9px}.starter-card{min-height:104px}.footer-note{margin-top:32px} }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important} }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="米库工作台导航">
        <a class="brand" href="#home" aria-label="米库首页"><img class="brand-logo" src="/assets/miku-home-art/cow-cat-logo.png" alt="" /><span class="brand-lockup"><span class="brand-name">米库</span><span class="brand-subtitle">AI Marketing Studio</span></span></a>
        <p class="side-label">工作台</p>
        <nav class="nav" aria-label="产品导航">
          <a class="nav-link" aria-current="page" href="#home"><span class="icon-glyph">home</span><span>首页</span></a>
          <a class="nav-link" href="#templates"><span class="icon-glyph">layers</span><span>模板</span></a>
          <a class="nav-link" href="#compose"><span class="icon-glyph">spark</span><span>工具</span></a>
          <a class="nav-link" href="#projects"><span class="icon-glyph">task</span><span>任务</span></a>
          <a class="nav-link" href="#profile"><span class="icon-glyph">person</span><span>我的</span></a>
        </nav>
        <section class="projects" id="projects" aria-label="项目"><div class="projects-heading"><p class="side-label">项目</p><div class="project-actions"><button class="tiny-button" type="button" id="newProjectButton" aria-label="新建项目"><span class="icon-glyph">plus</span></button><button class="tiny-button" type="button" id="moreProjectButton" aria-label="查看更多项目"><span class="icon-glyph">arrow</span></button></div></div><button class="project-item" type="button" data-prompt="继续推进本周小红书新品种草计划"><span class="project-dot"></span><span>本周新品种草计划</span></button><button class="project-item" type="button" data-prompt="继续完善品牌 IP 起号方案"><span class="project-dot" style="background:#f5a866"></span><span>品牌 IP 起号方案</span></button></section>
        <div class="side-footer"><div class="credit-panel" aria-label="会员额度"><div class="credit-line"><span class="credit-copy"><span class="icon-glyph">spark</span>Credits</span><span><strong>1,000</strong> / 1,000</span></div><button class="upgrade-button" type="button" id="upgradeButton">升级套餐</button></div><div class="profile-card" id="profile"><img class="profile-avatar" src="/assets/miku-home-art/cow-cat-logo.png" alt="" /><div class="profile-copy"><strong>Susan</strong><span>Pro 会员</span></div><button class="profile-settings" type="button" id="profileSettings" aria-label="账户设置"><span class="icon-glyph">settings</span></button></div></div>
      </aside>

      <div class="workspace"><header class="topbar"><button class="search-box" type="button" id="searchButton" aria-label="搜索模板和素材"><span class="icon-glyph">search</span><span>搜索模板、素材...</span></button><div class="top-actions"><button class="top-button" type="button" id="notificationButton" aria-label="通知"><span class="icon-glyph">bell</span></button><button class="top-avatar reference-crop" type="button" aria-label="个人中心"></button></div></header>
        <main class="main" id="home">
          <section class="hero-card" aria-labelledby="heroTitle"><div class="hero-copy"><div class="hero-kicker"><span class="icon-glyph">spark</span><span>米库营销工作台</span></div><h1 class="hero-title" id="heroTitle">今天你想做些什么？</h1><p class="hero-description">先把想法说出来，米库会帮你拆成清晰的任务、方案和内容动作。</p><div class="hero-tabs" role="tablist" aria-label="米库能力入口"><button class="hero-tab is-active" type="button" role="tab" aria-selected="true" data-mode="agent"><span class="icon-glyph">spark</span>Agent 模式</button><button class="hero-tab" type="button" role="tab" aria-selected="false" data-mode="image"><span class="icon-glyph">image</span>图片生成</button><button class="hero-tab" type="button" role="tab" aria-selected="false" data-mode="video"><span class="icon-glyph">video</span>视频生成</button><button class="hero-tab" type="button" role="tab" aria-selected="false" data-mode="plan"><span class="icon-glyph">calendar</span>内容规划</button></div></div><div class="hero-art-wrap" aria-hidden="true"><img class="hero-art" src="/assets/miku-home-art/home-slogan-expression.png" alt="" /></div></section>
          <section class="composer-section" id="compose" aria-label="开始一个营销任务"><div class="composer-panel"><div class="question-input-row"><div class="prompt-input-area"><div class="prompt-topline"><label class="sr-only" for="promptInput">告诉米库你想完成什么</label><textarea id="promptInput" class="prompt-input" placeholder="例：帮我制定一个新产品的上市营销方案"></textarea></div></div><button class="composer-helper" type="button" id="helperButton" aria-label="米库智能助手"><span class="icon-glyph">robot</span></button></div><div class="connector-bar" aria-hidden="true"></div><p class="prompt-status" id="promptStatus" role="status" aria-live="polite"></p></div></section>
          <section class="quick-section" aria-label="常用营销场景"><div class="quick-list"><button class="quick-card" type="button" data-prompt="帮我做一份新品上市营销方案"><span class="quick-icon"><span class="icon-glyph">launch</span></span><span>新品上市</span></button><button class="quick-card" type="button" data-prompt="帮我规划品牌或 IP 起号方案"><span class="quick-icon"><span class="icon-glyph">person-star</span></span><span>品牌 / IP 起号</span></button><button class="quick-card" type="button" data-prompt="帮我制定小红书种草矩阵"><span class="quick-icon"><span class="icon-glyph">grid</span></span><span>小红书种草</span></button><button class="quick-card" type="button" data-prompt="帮我写一组短视频脚本与分镜"><span class="quick-icon"><span class="icon-glyph">video</span></span><span>脚本与分镜</span></button><button class="quick-card" type="button" data-prompt="帮我做一周内容排期"><span class="quick-icon"><span class="icon-glyph">calendar</span></span><span>内容排期</span></button></div></section>
          <section class="starter-section" id="templates" aria-labelledby="starterTitle"><div class="section-heading"><div><h2 id="starterTitle">不知道从哪里开始？试试这些营销任务。</h2><p>选一个方向，米库会帮你把下一步拆出来。</p></div><a class="text-link" href="#templates">查看全部<span class="icon-glyph">arrow</span></a></div><div class="starter-grid"><button class="starter-card starter-card--mint" type="button" data-prompt="从零开始做一个品牌 IP 起号方案"><span class="starter-card-top"><span class="starter-tag">方案</span><span class="icon-glyph">arrow-up</span></span><span><h3>品牌 IP 起号方案</h3><p>定位、栏目、选题和 30 天内容日历</p></span></button><button class="starter-card starter-card--peach" type="button" data-prompt="帮我提炼产品卖点并生成小红书种草内容"><span class="starter-card-top"><span class="starter-tag">内容</span><span class="icon-glyph">arrow-up</span></span><span><h3>产品卖点提炼</h3><p>从用户关心的问题开始组织内容角度</p></span></button><button class="starter-card starter-card--blue" type="button" data-prompt="帮我把这份内容适配成小红书、公众号和短视频"><span class="starter-card-top"><span class="starter-tag">适配</span><span class="icon-glyph">arrow-up</span></span><span><h3>多平台内容适配</h3><p>同一套策略，拆成不同平台的表达版本</p></span></button></div></section>
          <p class="footer-note">米库会记住你的工作上下文，但每一步都由你确认。</p>
        </main>
      </div>
    </div>
    <script>
      (() => {
        const iconPaths = {
          home:'<path d="m4 10 8-6 8 6v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1Z"/><path d="M9 20v-6h6v6"/>', layers:'<path d="m12 4 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4M4 16l8 4 8-4"/>', spark:'<path d="m12 3 1.3 5.7L19 10l-5.7 1.3L12 17l-1.3-5.7L5 10l5.7-1.3L12 3Z"/><path d="m19 15 .6 2.4L22 18l-2.4.6L19 21l-.6-2.4L16 18l2.4-.6L19 15Z"/>', task:'<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 4.5h6M8.5 13.5l2.2 2.2 4.8-5"/>', person:'<circle cx="12" cy="8.5" r="3"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>', 'person-star':'<circle cx="9" cy="8.5" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M18 4l.8 2.2L21 7l-2.2.8L18 10l-.8-2.2L15 7l2.2-.8L18 4Z"/>', settings:'<path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>', search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>', bell:'<path d="M6 9a6 6 0 0 1 12 0c0 7 2 7 2 7H4s2 0 2-7Z"/><path d="M10 20h4"/>', plus:'<path d="M12 5v14M5 12h14"/>', arrow:'<path d="M5 12h13M13 6l6 6-6 6"/>', 'arrow-up':'<path d="M5 19 19 5M9 5h10v10"/>', image:'<rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m5 17 4-4 3 3 2-2 5 4"/>', video:'<rect x="4" y="6" width="12" height="12" rx="2"/><path d="m16 10 4-2v8l-4-2M9 10l4 2-4 2v-4Z"/>', calendar:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M8 17h5"/>', mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>', robot:'<rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 4v3M8 12h.01M16 12h.01M9 16h6"/>', tune:'<path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>', paperclip:'<path d="m9 12 5.5-5.5a3 3 0 0 1 4.2 4.2L11 18.4A5 5 0 1 1 3.9 11.3l7.4-7.4"/>', at:'<circle cx="12" cy="12" r="4"/><path d="M16 12v1a3 3 0 0 0 6 0v-1a10 10 0 1 0-3 7.2"/>', mention:'<circle cx="12" cy="12" r="8"/><path d="M8.5 12a3.5 3.5 0 1 0 7 0v-1.5M15.5 12v2"/>', link:'<path d="m10 13.5-1.5 1.5a3.5 3.5 0 1 1-5-5L7 6.5a3.5 3.5 0 0 1 5 0M14 10.5l1.5-1.5a3.5 3.5 0 1 1 5 5L17 17.5a3.5 3.5 0 0 1-5 0M8 16l8-8"/>', launch:'<path d="M5 19 19 5M9 5h10v10"/><path d="M5 5h4M5 5v4"/>', grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>', send:'<path d="m4 5 16 7-16 7 3.5-7L4 5Z"/><path d="M7.5 12H20"/>', check:'<path d="m5 12 4 4L19 6"/>'
        };
        function replaceIcons() { document.querySelectorAll('.icon-glyph').forEach((glyph) => { const name = glyph.textContent.trim(); if (!iconPaths[name]) return; const svg = document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.setAttribute('class','icon'); svg.setAttribute('viewBox','0 0 24 24'); svg.setAttribute('aria-hidden','true'); if (glyph.id) svg.id = glyph.id; svg.innerHTML = iconPaths[name]; glyph.replaceWith(svg); }); }
        function setIcon(node,name) { node.innerHTML = iconPaths[name] || ''; }
        replaceIcons();
        const input=document.querySelector('#promptInput'), status=document.querySelector('#promptStatus');
        const modeCopy={template:'例：帮我找一套适合新品上市的营销模板',agent:'例：帮我制定一个新产品的上市营销方案',image:'例如：做一张有春天气息的新品主视觉海报',video:'例如：为新品写一支 30 秒短视频脚本',plan:'例如：帮我排一个一周的小红书内容计划'};
        function setStatus(message) { status.textContent=message; clearTimeout(setStatus.timer); setStatus.timer=setTimeout(()=>{status.textContent='';},2800); }
        function fillPrompt(value,message='已把这个任务放进输入框') { input.value=value; setStatus(message); input.focus(); }
        function selectMode(mode,source) { document.querySelectorAll('.hero-tab').forEach((item)=>{const selected=item.dataset.mode===mode; item.classList.toggle('is-active',selected); item.setAttribute('aria-selected',String(selected)); }); input.placeholder=modeCopy[mode]||modeCopy.agent; if(source)setStatus(`已切换到${source}`); }
        document.querySelectorAll('.hero-tab').forEach((tab)=>tab.addEventListener('click',()=>selectMode(tab.dataset.mode,tab.textContent.trim())));
        document.querySelectorAll('[data-prompt]').forEach((item)=>item.addEventListener('click',()=>{document.querySelectorAll('.quick-card').forEach((card)=>card.classList.toggle('is-active',card===item));fillPrompt(item.dataset.prompt,'已选择这个营销任务');}));
        document.querySelector('#helperButton').addEventListener('click',()=>setStatus('米库智能助手已准备好'));
        document.querySelector('#searchButton').addEventListener('click',()=>{input.focus();setStatus('搜索入口已准备好');}); document.querySelector('#notificationButton').addEventListener('click',()=>setStatus('暂时没有新的通知')); document.querySelector('#newProjectButton').addEventListener('click',()=>fillPrompt('帮我新建一个营销项目','新项目已准备开始')); document.querySelector('#moreProjectButton').addEventListener('click',()=>setStatus('项目列表入口已准备好')); document.querySelector('#upgradeButton').addEventListener('click',()=>setStatus('套餐升级入口已准备好')); document.querySelector('#profileSettings').addEventListener('click',()=>setStatus('账户设置入口已准备好'));
      })();
    </script>

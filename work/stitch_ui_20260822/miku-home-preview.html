<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miku 米库 · 首页</title>
    <style>
      :root {
        --mint: #65d4c2;
        --mint-dark: #3bb9a7;
        --ink: #26332f;
        --muted: #7f8b86;
        --line: #d7e0dc;
        --line-soft: #edf1ef;
        --panel: #ffffff;
        --shadow: 0 10px 18px rgba(45, 67, 59, 0.13);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        min-height: 100dvh;
        margin: 0;
        color: var(--ink);
        background: #fff;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button, textarea { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }
      :focus-visible { outline: 3px solid rgba(101, 212, 194, 0.5); outline-offset: 3px; }

      .app-shell { min-height: 100dvh; }
      .icon { display: block; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .icon-glyph { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; font-size: 0; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 10;
        width: 256px;
        display: flex;
        flex-direction: column;
        padding: 20px 10px 10px;
        background: #fff;
        border-right: 1px solid var(--line-soft);
      }

      .brand { display: flex; align-items: center; gap: 9px; padding: 0 0 31px 60px; }
      .brand-logo { width: 48px; height: 48px; display: block; border-radius: 11px; object-fit: cover; }
      .brand-name { font-size: 28px; font-weight: 700; letter-spacing: -0.06em; }

      .nav { display: grid; gap: 5px; margin: 0 10px; }
      .nav-link {
        min-height: 51px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 10px;
        border-radius: 12px;
        color: #707b76;
        font-size: 16px;
        transition: background 180ms var(--ease), color 180ms var(--ease), transform 180ms var(--ease);
      }

      .nav-link:hover { color: var(--ink); background: #f4f8f6; transform: translateX(2px); }
      .nav-link[aria-current="page"] { color: #fff; background: var(--mint); }
      .nav-link .icon { color: #111; width: 22px; height: 22px; }
      .nav-link[aria-current="page"] .icon { color: #102b26; }

      .recent { margin: 26px 5px 0; padding: 20px 0 0; border-top: 1px solid var(--line-soft); }
      .recent-title { margin: 0 0 11px; color: #9aa49f; font-size: 14px; }
      .recent-link { display: block; padding: 8px 15px; color: #73807a; font-size: 14px; transition: color 180ms var(--ease); }
      .recent-link:hover { color: var(--mint-dark); }

      .profile-card { display: flex; align-items: center; gap: 10px; min-height: 59px; margin-top: auto; padding: 8px 11px; border-radius: 13px; color: #15423a; background: var(--mint); }
      .reference-crop { overflow: hidden; background-image: url('/reference/miku-home-reference.png'); background-repeat: no-repeat; background-size: 1440px 1024px; }
      .top-avatar { background-position: -1345px -13px; transform: translateY(-2px); }
      .profile-avatar { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; background-position: -19px -947px; transform: translateY(-3px); }
      .profile-copy { min-width: 0; flex: 1; line-height: 1.2; }
      .profile-copy strong, .profile-copy span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .profile-copy strong { font-size: 13px; }
      .profile-copy span { margin-top: 3px; color: #50766f; font-size: 12px; }
      .profile-settings { border: 0; padding: 4px; color: #3e766c; background: transparent; }

      .workspace { min-height: 100dvh; margin-left: 256px; }
      .topbar { height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 57px 0 47px; }
      .search-box { width: 242px; height: 40px; display: flex; align-items: center; gap: 12px; padding: 0 15px; border: 1px solid #cfd8d4; border-radius: 999px; color: #909a96; background: #fff; text-align: left; transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease); }
      .search-box:hover, .search-box:focus-visible { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(101, 212, 194, 0.12); }
      .search-box .icon { width: 20px; height: 20px; color: #1a2622; }
      .search-box span:last-child { font-size: 15px; }
      .top-actions { display: flex; align-items: center; gap: 27px; }
      .notification-button { position: relative; display: grid; place-items: center; padding: 0; border: 0; color: #14201d; background: transparent; }
      .notification-button .icon { width: 25px; height: 25px; }
      .notification-dot { position: absolute; top: -2px; right: -5px; width: 11px; height: 11px; border: 2px solid #fff; border-radius: 50%; background: var(--mint); }
      .top-avatar { width: 39px; height: 39px; border: 1px solid #cfd8d4; border-radius: 50%; }

      .main { width: min(100% - 48px, 1018px); margin: 0 auto; }
      .hero { position: relative; height: 220px; display: flex; justify-content: center; padding-top: 69px; }
      .hero h1 { margin: 0; transform: translateX(-24px); font-size: 32px; line-height: 1.25; letter-spacing: -0.045em; font-weight: 700; }

      .composer-section { position: relative; display: flow-root; height: 315px; }
      .mode-deck { position: absolute; top: 0; left: calc(50% - 13px); width: 610px; height: 94px; transform: translateX(-50%); }
      .mode-card { position: absolute; top: auto; bottom: -18px; width: 204px; height: 97px; border: 2px solid #d6d6d6; border-radius: 18px; background: #fff; transform-origin: center bottom; transition: transform 260ms cubic-bezier(0.16, 1, 0.3, 1), border-color 180ms var(--ease), box-shadow 180ms var(--ease); }
      .mode-card--left { left: 0; transform: rotate(-5deg); }
      .mode-card--center { left: 203px; height: 112px; z-index: 2; }
      .mode-card--right { right: 0; transform: rotate(5deg); }
      .mode-card:hover, .mode-card.is-selected { border-color: #cfcfcf; box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08); }
      .mode-card--left:hover, .mode-card--left.is-selected { transform: scaleY(1.44) rotate(0deg); z-index: 3; }
      .mode-card--center:hover, .mode-card--center.is-selected { transform: scaleY(1.25); z-index: 3; }
      .mode-card--right:hover, .mode-card--right.is-selected { transform: scaleY(1.44) rotate(0deg); z-index: 3; }

      .composer-panel { position: relative; z-index: 4; width: min(850px, 100%); height: 151px; margin: 82px auto 0; transform: translateX(-22px); padding: 31px 43px 16px; border: 2px solid #d2d2d2; border-radius: 38px; background: var(--panel); box-shadow: var(--shadow); }
      .prompt-input { position: relative; z-index: 1; width: 100%; height: 42px; resize: none; padding: 0; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 17px; line-height: 1.5; }
      .prompt-input::placeholder { color: #99a49f; }
      .composer-actions { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
      .prompt-tools { display: flex; align-items: center; gap: 5px; }
      .prompt-button { height: 33px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #d8d8d8; border-radius: 9px; color: #495852; background: #fff; transition: transform 160ms var(--ease), border-color 160ms var(--ease), background 160ms var(--ease); }
      .prompt-button:hover { transform: translateY(-2px); border-color: var(--mint); background: #f8fffd; }
      .mention-button { width: 33px; font-size: 23px; line-height: 1; }
      .quick-button { padding: 0 8px; color: #fff; border-color: var(--mint); background: var(--mint); font-size: 14px; }
      .quick-button:hover { color: #fff; background: var(--mint-dark); }
      .settings-button { width: 34px; }
      .settings-button .icon { width: 19px; height: 19px; }
      .send-button { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 50%; color: #fff; background: var(--mint); box-shadow: 0 4px 8px rgba(50, 145, 130, 0.16); transition: transform 160ms var(--ease), background 160ms var(--ease); }
      .send-button:hover { transform: translateY(-2px); background: var(--mint-dark); }
      .send-button:active { transform: scale(0.96); }
      .send-button .icon { width: 22px; height: 22px; }
      .prompt-status { min-height: 18px; margin: 1px 0 0; color: var(--muted); font-size: 12px; }

      .inspiration-section { padding-top: 9px; padding-bottom: 60px; }
      .inspiration-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 19px; }
      .inspiration-tabs { display: flex; align-items: center; gap: 31px; overflow-x: auto; scrollbar-width: none; }
      .inspiration-tabs::-webkit-scrollbar { display: none; }
      .inspiration-tab { flex: 0 0 auto; padding: 0; border: 0; color: #0f1815; background: transparent; font-size: 18px; white-space: nowrap; }
      .inspiration-tab:first-child { font-size: 28px; font-weight: 700; letter-spacing: -0.06em; }
      .inspiration-tab:not(:first-child) { transition: color 160ms var(--ease); }
      .inspiration-tab:not(:first-child):hover { color: var(--mint-dark); }
      .inspiration-tab.is-active { color: #0f1815; }
      .view-more { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; color: #77837e; font-size: 14px; }
      .view-more:hover { color: var(--mint-dark); }
      .view-more .icon { width: 15px; height: 15px; }

      .inspiration-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
      .inspiration-card { min-width: 0; overflow: hidden; padding: 13px 13px 14px; border: 1px solid #d7e0dc; border-radius: 20px; background: #fbfcfb; transition: transform 180ms var(--ease), box-shadow 180ms var(--ease), border-color 180ms var(--ease); }
      .inspiration-card:hover { transform: translateY(-4px); border-color: #b9d1c8; box-shadow: 0 8px 18px rgba(55, 90, 78, 0.12); }
      .inspiration-media { width: 100%; aspect-ratio: 0.76; border-radius: 1px; background-image: url('/reference/miku-home-reference.png'); background-repeat: no-repeat; background-size: 1440px 1024px; background-color: #f2f5f3; }
      .media-one { background-position: -340px -694px; }
      .media-two { background-position: -600px -694px; }
      .media-three { background-position: -869px -699px; }
      .media-four { background-position: -1126px -699px; }
      .inspiration-title { display: block; overflow: hidden; margin-top: 11px; color: #111815; font-size: 16px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }

      @media (max-width: 1100px) {
        .topbar { padding-right: 28px; padding-left: 28px; }
        .main { width: min(100% - 48px, 900px); }
        .hero h1 { transform: none; }
        .composer-panel { transform: none; }
        .inspiration-grid { gap: 16px; }
        .mode-deck { transform: translateX(-50%) scale(0.92); transform-origin: top center; }
      }

      @media (max-width: 820px) {
        .sidebar { width: 84px; padding: 16px 10px 10px; align-items: center; }
        .workspace { margin-left: 84px; }
        .brand { padding: 0 0 27px; }
        .brand-name, .recent, .profile-card, .nav-link span:last-child { display: none; }
        .nav { width: 100%; margin: 0; }
        .nav-link { justify-content: center; padding: 0; }
        .topbar { padding: 0 24px; }
        .main { width: min(100% - 40px, 700px); }
        .hero h1 { font-size: 30px; }
        .composer-panel { padding-right: 30px; padding-left: 30px; }
        .inspiration-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 620px) {
        .app-shell { display: block; }
        .sidebar { position: static; width: 100%; height: auto; display: flex; flex-direction: row; justify-content: space-between; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--line-soft); }
        .brand { padding: 0; }
        .brand-logo { width: 42px; height: 42px; }
        .nav { width: auto; display: flex; gap: 3px; }
        .nav-link { width: 38px; min-height: 42px; }
        .nav-link .icon { width: 20px; height: 20px; }
        .workspace { margin-left: 0; }
        .topbar { height: 64px; padding: 0 16px; }
        .search-box { width: 200px; height: 36px; }
        .top-actions { gap: 15px; }
        .hero { height: 190px; padding-top: 28px; }
        .hero h1 { max-width: 260px; font-size: 28px; text-align: center; }
        .composer-section { height: 260px; }
        .mode-deck { width: 100%; height: 78px; }
        .mode-card { width: 33%; height: 76px; border-radius: 14px; }
        .mode-card--center { left: 33%; height: 88px; }
        .mode-card--left:hover, .mode-card--left.is-selected, .mode-card--right:hover, .mode-card--right.is-selected { transform: scaleY(1.3) rotate(0deg); }
        .mode-card--center:hover, .mode-card--center.is-selected { transform: scaleY(1.13); }
        .composer-panel { width: 100%; height: 154px; margin-top: 66px; padding: 27px 22px 13px; border-radius: 26px; }
        .prompt-input { font-size: 15px; }
        .inspiration-heading { display: block; margin-bottom: 15px; }
        .inspiration-tabs { gap: 20px; padding-bottom: 13px; }
        .inspiration-tab { font-size: 15px; }
        .inspiration-tab:first-child { font-size: 23px; }
        .view-more { float: right; margin-top: -39px; }
        .inspiration-grid { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
        .inspiration-card { flex: 0 0 190px; }
      }

      @media (min-width: 1600px) {
        .sidebar {
          width: 326px;
          padding: 20px 10px 16px;
        }

        .brand {
          gap: 11px;
          padding: 0 0 69px 75px;
        }

        .brand-logo {
          width: 62px;
          height: 62px;
          border-radius: 14px;
        }

        .brand-name { font-size: 38px; }

        .nav { gap: 7px; }
        .nav-link {
          min-height: 67px;
          gap: 11px;
          padding: 0 12px;
          border-radius: 16px;
          font-size: 22px;
        }
        .nav-link .icon { width: 28px; height: 28px; }

        .recent {
          margin: 16px 5px 0;
          padding-top: 25px;
        }
        .recent-title { margin-bottom: 13px; font-size: 20px; }
        .recent-link { padding: 10px 20px; font-size: 20px; }

        .profile-card {
          min-height: 77px;
          padding: 10px 14px;
          border-radius: 17px;
        }
        .reference-crop { background-size: 1994px 1418px; }
        .top-avatar {
          width: 54px;
          height: 54px;
          background-position: -1862px -18px;
          border-radius: 50%;
          transform: translateY(-3px);
        }
        .profile-avatar {
          width: 56px;
          height: 56px;
          background-position: -26px -1312px;
          transform: translateY(-3px);
        }
        .profile-copy strong { font-size: 17px; }
        .profile-copy span { font-size: 15px; }
        .profile-settings { padding: 5px; }
        .profile-settings .icon { width: 28px; height: 28px; }

        .workspace { margin-left: 326px; }
        .topbar {
          height: 92px;
          padding: 0 205px 0 61px;
        }
        .search-box {
          width: 315px;
          height: 53px;
          gap: 15px;
          padding: 0 20px;
          border-radius: 999px;
        }
        .search-box .icon { width: 26px; height: 26px; }
        .search-box span:last-child { font-size: 20px; }
        .top-actions {
          gap: 29px;
          transform: translateY(-5px);
        }
        .notification-button .icon { width: 33px; height: 33px; }
        .notification-dot { top: -2px; right: -6px; width: 14px; height: 14px; }

        .main {
          width: 1320px;
          margin: 0 0 0 77px;
        }
        .hero {
          height: 297px;
          padding-top: 103px;
        }
        .hero h1 {
          transform: translateX(-16px);
          font-size: 54px;
        }

        .composer-section { height: 420px; }
        .mode-deck {
          left: calc(50% - 13px);
          width: 771px;
          height: 120px;
        }
        .mode-card {
          top: auto;
          bottom: -23px;
          width: 260px;
          height: 124px;
          border-width: 3px;
          border-radius: 23px;
        }
        .mode-card--center {
          left: 258px;
          height: 142px;
        }
        .mode-card--left:hover, .mode-card--left.is-selected, .mode-card--right:hover, .mode-card--right.is-selected { transform: scaleY(1.25) rotate(0deg); }
        .mode-card--center:hover, .mode-card--center.is-selected { transform: scaleY(1.1); }

        .composer-panel {
          width: 1105px;
          height: 198px;
          margin-top: 101px;
          transform: translateX(-26px);
          padding: 47px 55px 18px;
          border-width: 3px;
          border-radius: 49px;
        }
        .prompt-input {
          height: 54px;
          font-size: 26px;
        }
        .composer-actions { margin-top: 26px; }
        .prompt-tools { gap: 7px; }
        .prompt-button {
          height: 45px;
          border-width: 2px;
          border-radius: 12px;
          font-size: 20px;
        }
        .mention-button { width: 45px; font-size: 30px; }
        .quick-button { padding: 0 11px; }
        .settings-button { width: 46px; }
        .settings-button .icon { width: 25px; height: 25px; }
        .send-button {
          width: 49px;
          height: 49px;
        }
        .send-button .icon { width: 29px; height: 29px; }

        .inspiration-section {
          padding-top: 15px;
          padding-bottom: 78px;
        }
        .inspiration-heading { margin-bottom: 7px; }
        .inspiration-tabs { gap: 40px; }
        .inspiration-tab { font-size: 24px; }
        .inspiration-tab:first-child { font-size: 38px; line-height: 1.2; }
        .view-more { gap: 6px; font-size: 20px; }
        .view-more .icon { width: 20px; height: 20px; }
        .inspiration-grid { gap: 31px; }
        .inspiration-card {
          padding: 18px 18px 20px;
          border-width: 2px;
          border-radius: 25px;
        }
        .inspiration-title { margin-top: 14px; font-size: 20px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#home" aria-label="米库首页">
          <img class="brand-logo" src="/assets/miku-home-art/cow-cat-logo.png" alt="" />
          <span class="brand-name">米库</span>
        </a>

        <nav class="nav" aria-label="产品导航">
          <a class="nav-link" aria-current="page" href="#home"><span class="icon-glyph">grid_view</span><span>首页</span></a>
          <a class="nav-link" href="#inspiration"><span class="icon-glyph">dashboard_customize</span><span>模板</span></a>
          <a class="nav-link" href="#compose"><span class="icon-glyph">build</span><span>工具</span></a>
          <a class="nav-link" href="#compose"><span class="icon-glyph">assignment_turned_in</span><span>任务</span></a>
          <a class="nav-link" href="#profile"><span class="icon-glyph">account_circle</span><span>我的</span></a>
        </nav>

        <section class="recent" aria-label="最近任务">
          <p class="recent-title">最近</p>
          <a class="recent-link" href="#compose">季度营销分析报告</a>
          <a class="recent-link" href="#compose">小红书投放策略</a>
        </section>

        <div class="profile-card" id="profile">
          <span class="profile-avatar reference-crop" aria-hidden="true"></span>
          <div class="profile-copy"><strong>Susan</strong><span>Pro会员</span></div>
          <button class="profile-settings" type="button" aria-label="账户设置"><span class="icon-glyph">settings</span></button>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <button class="search-box" type="button" id="searchButton" aria-label="搜索模板和素材"><span class="icon-glyph">search</span><span>搜索模板、素材...</span></button>
          <div class="top-actions">
            <button class="notification-button" type="button" aria-label="通知"><span class="icon-glyph">notifications</span><span class="notification-dot" aria-hidden="true"></span></button>
            <button class="top-avatar reference-crop" type="button" aria-label="个人中心"></button>
          </div>
        </header>

        <main class="main" id="home">
          <section class="hero" aria-labelledby="heroTitle">
            <h1 id="heroTitle">Hi，今天你想做些什么？</h1>
          </section>

          <section class="composer-section" id="compose" aria-label="开始创作">
            <div class="mode-deck" role="tablist" aria-label="生成模式">
              <button class="mode-card mode-card--left" type="button" role="tab" aria-selected="false" data-mode="image" aria-label="图片生成"></button>
              <button class="mode-card mode-card--center is-selected" type="button" role="tab" aria-selected="true" data-mode="agent" aria-label="Agent模式"></button>
              <button class="mode-card mode-card--right" type="button" role="tab" aria-selected="false" data-mode="video" aria-label="视频生成"></button>
            </div>
            <div class="composer-panel" data-composer-mode="agent">
              <label class="sr-only" for="promptInput">告诉米库你想完成什么</label>
              <textarea id="promptInput" class="prompt-input" placeholder="请告诉我的想法，我来为你实现"></textarea>
              <div class="composer-actions">
                <div class="prompt-tools">
                  <button class="prompt-button mention-button" type="button" id="mentionButton" aria-label="添加提及">@</button>
                  <button class="prompt-button quick-button" type="button" id="quickButton">+ 常用需求</button>
                  <button class="prompt-button settings-button" type="button" id="settingsButton" aria-label="生成设置"><span class="icon-glyph">tune</span></button>
                </div>
                <button class="send-button" type="button" id="sendButton" aria-label="发送"><span class="icon-glyph" id="sendIcon">send</span></button>
              </div>
              <p class="prompt-status" id="promptStatus" role="status" aria-live="polite"></p>
            </div>
          </section>

          <section class="inspiration-section" id="inspiration" aria-labelledby="inspirationTitle">
            <div class="inspiration-heading">
              <div class="inspiration-tabs" role="tablist" aria-label="灵感分类">
                <button class="inspiration-tab is-active" type="button" role="tab" aria-selected="true" id="inspirationTitle">灵感库</button>
                <button class="inspiration-tab" type="button" role="tab" aria-selected="false">小红书种草笔记</button>
                <button class="inspiration-tab" type="button" role="tab" aria-selected="false">公众号图文</button>
                <button class="inspiration-tab" type="button" role="tab" aria-selected="false">探店攻略</button>
                <button class="inspiration-tab" type="button" role="tab" aria-selected="false">爆款封面</button>
              </div>
              <a class="view-more" href="#inspiration">查看更多<span class="icon-glyph">arrow_forward</span></a>
            </div>
            <div class="inspiration-grid">
              <a class="inspiration-card" href="#compose" data-scenario="卡通涂鸦拼贴风招聘海报"><div class="inspiration-media media-one" role="img" aria-label="卡通涂鸦拼贴风招聘海报"></div><span class="inspiration-title">卡通涂鸦拼贴风招聘...</span></a>
              <a class="inspiration-card" href="#compose" data-scenario="职场干货小红书封面"><div class="inspiration-media media-two" role="img" aria-label="职场干货小红书封面"></div><span class="inspiration-title">职场干货小红书封面</span></a>
              <a class="inspiration-card" href="#compose" data-scenario="科学育儿干货小红书封面"><div class="inspiration-media media-three" role="img" aria-label="科学育儿干货小红书封面"></div><span class="inspiration-title">科学育儿干货小红书封面</span></a>
              <a class="inspiration-card" href="#compose" data-scenario="极简高级风618开门红促销"><div class="inspiration-media media-four" role="img" aria-label="极简高级风618开门红促销"></div><span class="inspiration-title">极简高级ins风618开门红促...</span></a>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script>
      (() => {
        const iconPaths = {
          search: '<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',
          notifications: '<path d="M6 9a6 6 0 0 1 12 0c0 7 2 7 2 7H4s2 0 2-7Z"/><path d="M10 20h4"/>',
          grid_view: '<rect x="5" y="5" width="5" height="5" rx="1"/><rect x="14" y="5" width="5" height="5" rx="1"/><rect x="5" y="14" width="5" height="5" rx="1"/><rect x="14" y="14" width="5" height="5" rx="1"/>',
          dashboard_customize: '<rect x="5" y="5" width="5" height="5" rx="1"/><rect x="14" y="5" width="5" height="5" rx="1"/><rect x="5" y="14" width="5" height="5" rx="1"/><path d="M16.5 14v5M14 16.5h5"/>',
          build: '<path d="m14.7 6.3 3-3a5 5 0 0 0-6.5 6.5L4.5 16.5a2.1 2.1 0 1 0 3 3l6.7-6.7a5 5 0 0 0 6.5-6.5l-3 3-3-3Z"/>',
          assignment_turned_in: '<rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 4.5h6M8.5 13.5l2.2 2.2 4.8-5"/>',
          account_circle: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="2.7"/><path d="M7.5 18a4.5 4.5 0 0 1 9 0"/>',
          settings: '<path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
          tune: '<path d="M4 7h8M16 7h4M4 17h4M12 17h8"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
          send: '<path d="m4 5 16 7-16 7 3.5-7L4 5Z"/><path d="M7.5 12H20"/>',
          check: '<path d="m5 12 4 4L19 6"/>',
          arrow_forward: '<path d="M5 12h13M13 6l6 6-6 6"/>'
        };

        function replaceIcons() {
          document.querySelectorAll('.icon-glyph').forEach((glyph) => {
            const name = glyph.textContent.trim();
            if (!iconPaths[name]) return;
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'icon');
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('aria-hidden', 'true');
            if (glyph.id) svg.id = glyph.id;
            svg.innerHTML = iconPaths[name];
            glyph.replaceWith(svg);
          });
        }

        function setIcon(node, name) { node.innerHTML = iconPaths[name] || ''; }
        replaceIcons();

        const input = document.querySelector('#promptInput');
        const status = document.querySelector('#promptStatus');
        const sendButton = document.querySelector('#sendButton');
        const sendIcon = document.querySelector('#sendIcon');
        const modeCards = [...document.querySelectorAll('.mode-card')];
        const inspirationTabs = [...document.querySelectorAll('.inspiration-tab')];
        const inspirationCards = [...document.querySelectorAll('.inspiration-card')];
        const modes = { agent: '请告诉我的想法，我来为你实现', image: '告诉我你想生成什么图片', video: '描述你想制作的视频内容' };

        function setStatus(message) {
          status.textContent = message;
          window.clearTimeout(setStatus.timer);
          setStatus.timer = window.setTimeout(() => { status.textContent = ''; }, 2600);
        }

        modeCards.forEach((card) => {
          card.addEventListener('click', () => {
            modeCards.forEach((item) => {
              const selected = item === card;
              item.classList.toggle('is-selected', selected);
              item.setAttribute('aria-selected', String(selected));
            });
            document.querySelector('.composer-panel').dataset.composerMode = card.dataset.mode;
            input.placeholder = modes[card.dataset.mode];
          });
        });

        inspirationTabs.forEach((tab) => {
          tab.addEventListener('click', () => {
            inspirationTabs.forEach((item) => {
              const selected = item === tab;
              item.classList.toggle('is-active', selected);
              item.setAttribute('aria-selected', String(selected));
            });
            setStatus(`已选择${tab.textContent.trim()}`);
          });
        });

        inspirationCards.forEach((card) => {
          card.addEventListener('click', (event) => {
            event.preventDefault();
            input.value = `参考「${card.dataset.scenario}」做一版新的内容`;
            setStatus(`已载入${card.dataset.scenario}`);
            input.focus();
          });
        });

        document.querySelectorAll('.recent-link').forEach((link) => {
          link.addEventListener('click', (event) => {
            event.preventDefault();
            input.value = `继续推进「${link.textContent.trim()}」`;
            setStatus(`已恢复${link.textContent.trim()}`);
            input.focus();
          });
        });

        document.querySelector('#searchButton').addEventListener('click', () => { input.focus(); setStatus('搜索入口已准备好'); });
        document.querySelector('#mentionButton').addEventListener('click', () => { input.value += `${input.value ? ' ' : ''}@品牌资料`; input.focus(); });
        document.querySelector('#quickButton').addEventListener('click', () => { input.value = '帮我制定一份小红书新品种草计划'; setStatus('已填入常用需求'); input.focus(); });
        document.querySelector('#settingsButton').addEventListener('click', () => setStatus('生成设置入口已准备好'));
        document.querySelector('.profile-settings').addEventListener('click', () => setStatus('账户设置入口已准备好'));

        sendButton.addEventListener('click', () => {
          if (!input.value.trim()) {
            setStatus('先告诉我你想完成什么任务');
            input.focus();
            return;
          }
          setIcon(sendIcon, 'check');
          sendButton.setAttribute('aria-label', '已发送');
          setStatus('已创建任务草稿，下一步进入工作区');
          window.setTimeout(() => { setIcon(sendIcon, 'send'); sendButton.setAttribute('aria-label', '发送'); }, 1600);
        });
      })();
    </script>
  </body>
</html>
